              oneOf:
              - $ref: '#/components/schemas/LocalizedString'
              - type: 'null'
            ingredients:
              description: Educational ingredient detail.
              oneOf:
              - $ref: '#/components/schemas/LocalizedString'
              - type: 'null'
            dosing:
              description: Educational dosing detail.
              oneOf:
              - $ref: '#/components/schemas/LocalizedString'
              - type: 'null'
            directions_en:
