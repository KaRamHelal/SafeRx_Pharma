openapi: 3.1.1
info:
  title: SafeRx Enterprise Public Components
  version: 2.0.2-preview.1
paths: {}
components:
  securitySchemes:
    enterpriseApiKey:
      type: apiKey
      in: header
      name: X-SafeRx-API-Key
      description: API key used as the HMAC signing secret. X-SafeRx-Timestamp, X-SafeRx-Nonce,
        and X-SafeRx-Signature are also required.
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sfrxId:
      name: sfrx_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^SRX-[0-9]{3}-[0-9]{6}$
    signedNonce:
      name: X-SafeRx-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    signedSignature:
      name: X-SafeRx-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    signedTimestamp:
      name: X-SafeRx-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
  schemas:
    ClientSafetyCheckRequest:
      description: Enterprise safety-check input is request-scoped only. There is no
        server-held saved profile for this surface -- every patient factor considered
        for a check must be supplied explicitly on the request.
      type: object
      required:
      - medications
      - locale
      - requested_domains
      properties:
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        medications:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - input_text
            properties:
              client_medication_id:
                type:
                - string
                - 'null'
              input_text:
                type: string
                minLength: 1
              sfrx_id:
                type:
                - string
                - 'null'
                pattern: ^SRX-[0-9]{3}-[0-9]{6}$
              dose_text:
                type:
                - string
                - 'null'
              route:
                type:
                - string
                - 'null'
              frequency_text:
                type:
                - string
                - 'null'
              role:
                description: Which medication role this entry plays in the check.
                  target_medication is the medication under review; current_medication
                  marks a concurrently taken medication supplied for interaction
                  checking. Defaults to target_medication.
                type: string
                enum:
                - target_medication
                - current_medication
                default: target_medication
        patient_context:
          $ref: '#/components/schemas/PatientSafetyContext'
        requested_domains:
          type: array
          items:
            type: string
            enum:
            - pllr
            - ddi
            - clinical_dose
            - food_interactions
            - meal_timing
            - allergy
          uniqueItems: true
        idempotency_key:
          type:
          - string
          - 'null'
      additionalProperties: false
    PatientSafetyContext:
      description: Optional patient factors considered for this single request only.
        Enterprise never reads or writes a saved profile; omitted fields are treated
        as unknown, not as "no risk factor present".
      type: object
      additionalProperties: false
      properties:
        age_years:
          description: Current age in years. Prefer date_of_birth when available;
            supply this only with age_reference_date if you have a snapshot age
            rather than a birth date.
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 150
        date_of_birth:
          description: Preferred age anchor. The current age is derived from this
            at evaluation time, so age-dependent guidance stays correct on later
            requests without resending an updated age_years.
          type:
          - string
          - 'null'
          format: date
        age_reference_date:
          description: Date on which the supplied age_years was true. Required
            alongside age_years when date_of_birth is not available, so age can
            still be advanced correctly over time.
          type:
          - string
          - 'null'
          format: date
        sex:
          description: Biological sex, used for domains where it affects
            evaluation (e.g. dosing). Use unknown rather than omitting the field
            when truly unknown.
          type:
          - string
          - 'null'
          enum:
          - female
          - male
          - intersex
          - unknown
          - null
        weight_kg:
          description: Body weight in kilograms, used for weight-sensitive dosing
            guidance where supported.
          type:
          - number
          - 'null'
          minimum: 0
        pregnancy_status:
          description: Current pregnancy status. not_applicable is distinct from
            unknown -- use it when pregnancy status genuinely does not apply
            (e.g. sex is male).
          type:
          - string
          - 'null'
          enum:
          - pregnant
          - not_pregnant
          - unknown
          - not_applicable
          - null
        lactation_status:
          description: Current lactation status. not_applicable is distinct from
            unknown -- use it when lactation status genuinely does not apply.
          type:
          - string
          - 'null'
          enum:
          - lactating
          - not_lactating
          - unknown
          - not_applicable
          - null
        pregnancy_context:
          description: Stage-aware pregnancy detail. Gestational age and trimester
            are derived server-side from these fields at evaluation time; do not
            compute trimester locally and send only the derived value.
          type: object
          additionalProperties: false
          properties:
            lmp_date:
              description: Last menstrual period date. Preferred source for
                deriving current gestational age when available.
              type:
              - string
              - 'null'
              format: date
            gestational_age_reference_date:
              description: Date on which the supplied gestational_age_weeks or
                gestational_age_months_approx was true. Required alongside those
                fields when lmp_date is not available, so gestational age can
                still be advanced correctly over time.
              type:
              - string
              - 'null'
              format: date
            gestational_age_weeks:
              description: Gestational age in weeks as of gestational_age_reference_date,
                when lmp_date is not available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 45
            gestational_age_months_approx:
              description: Approximate gestational age in months as of
                gestational_age_reference_date, when a more precise weeks value
                is not available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 11
        lactation_context:
          description: Infant-age detail used for lactation-specific guidance.
            Infant age is advanced server-side from these fields at evaluation
            time when an exact date of birth is not available.
          type: object
          additionalProperties: false
          properties:
            infant_age_reference_date:
              description: Date on which the supplied infant_age_days or
                infant_age_months_approx was true.
              type:
              - string
              - 'null'
              format: date
            infant_age_days:
              description: Infant age in days as of infant_age_reference_date.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 3650
            infant_age_months_approx:
              description: Approximate infant age in months as of
                infant_age_reference_date, when an exact day count is not
                available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 120
        renal:
          description: Renal function context used for dose and interaction
            guidance in renally-cleared medications.
          type: object
          additionalProperties: false
          properties:
            crcl_ml_min:
              description: Creatinine clearance in mL/min, when known directly.
              type:
              - number
              - 'null'
              minimum: 0
            egfr_ml_min_1_73m2:
              description: Estimated glomerular filtration rate (mL/min/1.73m²),
                when known directly.
              type:
              - number
              - 'null'
              minimum: 0
            status:
              description: Categorical renal function status. Supply this when a
                numeric crcl_ml_min/egfr_ml_min_1_73m2 value is not available.
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - failure
              - dialysis
              - unknown
              - null
        hepatic:
          description: Hepatic function context used for dose and interaction
            guidance in hepatically-cleared medications.
          type: object
          additionalProperties: false
          properties:
            child_pugh:
              description: Child-Pugh class, when known directly.
              type:
              - string
              - 'null'
              enum:
              - A
              - B
              - C
              - unknown
              - null
            status:
              description: Categorical hepatic function status. Supply this when
                a Child-Pugh class is not available.
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - unknown
              - null
        conditions:
          description: Normalized clinical-dose condition identifiers relevant to
            dosing and interaction guidance.
          type: array
          maxItems: 50
          items:
            type: string
            enum:
            - arrhythmia
            - asthma
            - bph
            - coronary
            - depression
            - diabetes
            - epilepsy
            - gi_bleeding
            - glaucoma
            - heart_failure
            - hypertension
            - hyperthyroidism
            - hypothyroidism
            - parkinsons
        allergy_state:
          type:
          - string
          - 'null'
          description: Explicitly distinguishes unknown allergies from confirmed no
            known allergies.
          enum:
          - unknown
          - confirmed_none
          - has_entries
          - null
        allergies:
          description: Individual allergy entries. Only meaningful alongside
            allergy_state == has_entries.
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - input_text
            properties:
              input_text:
                description: Free-text allergy description as reported.
                type: string
              entry_type:
                description: How input_text should be interpreted for matching --
                  a free-text description, a known allergy family, or a specific
                  product.
                type:
                - string
                - 'null'
                enum:
                - free_text
                - family
                - product
                - null
        diet_profile:
          description: Diet, supplement, and fasting context used for
            food-interaction and meal-timing guidance.
          type: object
          additionalProperties: false
          properties:
            diet_patterns:
              description: Active diet patterns. Currently source-backed patterns
                are vegan, keto_low_carb, high_protein_fitness, mediterranean,
                intermittent_fasting, and ramadan_fasting; other values are
                accepted as non-signaling context.
              type: array
              uniqueItems: true
              maxItems: 20
              items:
                type: string
                enum:
                - vegetarian
                - vegan
                - pescatarian
                - keto_low_carb
                - high_protein_fitness
                - mediterranean
                - dash_low_sodium
                - diabetes_carb_managed
                - renal_modified
                - gluten_free
                - lactose_or_cow_milk_free
                - low_fodmap
                - low_purine
                - halal
                - kosher
                - ramadan_fasting
                - intermittent_fasting
                - other
            fasting_pattern:
              description: Active fasting pattern, relevant to meal-timing
                guidance for medications with food/timing constraints.
              type:
              - string
              - 'null'
              enum:
              - none
              - ramadan
              - intermittent_fasting
              - time_restricted_eating
              - unknown
              - null
            food_exposures:
              description: Confirmed or reported dietary/food exposures relevant
                to food-interaction guidance (e.g. grapefruit, tyramine-rich
                foods).
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    description: Which food exposure this entry reports.
                    type: string
                    enum:
                    - alcohol
                    - grapefruit_citrus
                    - dairy_calcium
                    - vitamin_k_leafy_greens
                    - caffeine
                    - tyramine_aged_fermented
                    - potassium_foods_or_salt_substitute
                    - high_fiber
                    - high_fat_meal
                    - licorice
                    - green_tea
                    - hibiscus
                    - black_seed
                    - fenugreek
                    - fava_beans
                    - other
                  confirmation_state:
                    description: How confidently this exposure applies to the
                      patient right now.
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
            supplement_exposures:
              description: Confirmed or reported supplement use relevant to
                interaction guidance.
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    description: Which supplement this entry reports.
                    type: string
                    enum:
                    - protein_powder_whey_casein
                    - calcium
                    - iron
                    - magnesium
                    - potassium_or_electrolyte
                    - caffeine_preworkout
                    - creatine
                    - herbal_supplement
                    - other
                  confirmation_state:
                    description: How confidently this supplement use applies to
                      the patient right now.
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
    IngredientList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - display_obligations
      - items
      - pagination
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          type: array
          items:
            type: object
            required:
            - ingredient_id
            - ingredient_type
            - display_name
            - linked_product_count
            - linked_sfrx_ids
            properties:
              ingredient_id:
                type: string
              ingredient_type:
                type: string
                enum:
                - active
                - generic_component
                - therapeutic_class
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              linked_product_count:
                type: integer
                minimum: 0
              linked_sfrx_ids:
                type: array
                items:
                  type: string
              correction_anchors:
                type: array
                items:
                  type: object
                  additionalProperties: false
            additionalProperties: false
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    MedicationResolutionList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MedicationResolution'
      additionalProperties: false
    MedicationResolutionRequest:
      type: object
      required:
      - request_id
      - schema_version
      - educational_context
      - source_provenance
      - locale
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        summary:
          $ref: '#/components/schemas/LocalizedString'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    ProblemDetails:
      description: RFC 9457 problem response returned for every non-success status.
        Always check code for programmatic handling; detail is for humans and may
        change wording without notice.
      type: object
      required:
      - type
      - title
      - status
      - request_id
      - code
      properties:
        type:
          description: A URI identifying the problem type. Stable for a given code.
          type: string
          format: uri-reference
        title:
          description: Short, human-readable summary of the problem type.
          type: string
        status:
          description: HTTP status code, repeated here for convenience.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: Human-readable detail specific to this occurrence. Not
            stable -- do not pattern-match on this text; use code instead.
          type: string
        instance:
          description: URI identifying this specific occurrence, when available.
          type: string
        request_id:
          description: Request identifier for this occurrence. Include it when
            contacting support about a specific failure.
          type: string
        code:
          description: Stable machine-readable error code. Safe to switch on.
          type: string
        retry_after_seconds:
          description: Seconds to wait before retrying, when applicable (e.g.
            429, some 503s). Prefer this or the Retry-After header over a fixed
            client-side backoff.
          type:
          - integer
          - 'null'
        retry_after:
          description: Compatibility projection of Retry-After in seconds for existing
            web clients.
          type:
          - integer
          - 'null'
          minimum: 0
        quota_metric:
          description: Which quota class this error relates to, when the error is
            quota-related.
          type:
          - string
          - 'null'
        rate_limit:
          description: Current rate-limit window state, present on rate-limit
            errors.
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            limit:
              description: Requests allowed in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              description: Requests remaining in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            reset:
              description: Seconds until the window resets.
              type:
              - integer
              - 'null'
              minimum: 0
        quota:
          description: Current quota state, present on quota-related errors.
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            metric:
              description: Which quota class this quota state describes.
              type:
              - string
              - 'null'
            limit:
              description: Total allowance for the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              description: Allowance remaining in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            reset_at:
              description: When the current window resets.
              type:
              - string
              - 'null'
              format: date-time
            window_seconds:
              description: Length of the quota window in seconds.
              type:
              - integer
              - 'null'
              minimum: 0
        safe_to_retry:
          description: Whether this exact request is safe to retry as-is (e.g.
            after a transient 503) without risk of duplicating a side-effecting
            operation.
          type: boolean
      additionalProperties: false
    RegistryProductDetail:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - display_obligations
      - sfrx_id
      - product_tier
      - display_name
      - generic_components
      - dosage_form
      - route
      - domain_availability
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        sfrx_id:
          type: string
        parent_sfrx_id:
          type:
          - string
          - 'null'
        product_tier:
          type: string
          enum:
          - pharma
          - semi
          - non_pharma
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        trade_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        primary_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        generic_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        generic_components:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
        strength:
          type:
          - string
          - 'null'
        dosage_form:
          $ref: '#/components/schemas/LocalizedString'
        route:
          $ref: '#/components/schemas/LocalizedString'
        manufacturer:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        package:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        barcode:
          type:
          - string
          - 'null'
        category_trail:
          type: array
          items:
            type: object
            required:
            - level
            - label
            properties:
              level:
                type: string
              label:
                $ref: '#/components/schemas/LocalizedString'
            additionalProperties: false
        facts:
          type: object
          additionalProperties: false
        clinical_uses:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        pharmacology:
          type: object
          additionalProperties: false
        prose_details:
          type: object
          additionalProperties: false
        warnings:
          type: object
          additionalProperties: false
        domain_availability:
          type: object
          additionalProperties:
            type: string
            enum:
            - available
            - not_available
            - not_covered
            - unknown
      additionalProperties: false
    RegistryProductSummaryList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      - pagination
      - display_obligations
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        items:
          type: array
          items:
            type: object
            required:
            - sfrx_id
            - display_name
            - generic_name
            - strength
            - route
            - dosage_form
            properties:
              sfrx_id:
                type: string
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              generic_name:
                $ref: '#/components/schemas/LocalizedString'
              strength:
                type:
                - string
                - 'null'
              route:
                $ref: '#/components/schemas/LocalizedString'
              dosage_form:
                $ref: '#/components/schemas/LocalizedString'
            additionalProperties: false
        pagination:
          $ref: '#/components/schemas/Pagination'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    RegistrySuggestionList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      - display_obligations
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        items:
          type: array
          items:
            type: object
            required:
            - sfrx_id
            - display_name
            - match_reason
            - score
            properties:
              sfrx_id:
                type: string
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              match_reason:
                $ref: '#/components/schemas/LocalizedString'
              score:
                type: number
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    SafetyCapabilities:
      type: object
      required:
      - request_id
      - schema_version
      - educational_context
      - source_provenance
      - locale
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        summary:
          $ref: '#/components/schemas/LocalizedString'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    SafetyCheckResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - result_id
      - schema_version
      - surface
      - locale
      - educational_context
      - source_provenance
      - review
      - summary
      - context_summary
      - signals
      - domain_coverage
      - unavailable_domains
      - limitations
      - display_obligations
      - correction_anchors
      properties:
        request_id:
          description: Echo of the request identifier for correlation.
          type: string
        result_id:
          description: Stable identifier for this specific safety check result.
          type: string
        schema_version:
          description: Semantic version of this response's schema shape.
          type: string
        surface:
          description: Which SafeRx surface produced this result. Always
            enterprise_api for calls made through this API.
          type: string
          enum:
          - browser
          - enterprise_api
          - partner_api
        locale:
          description: Locale used for localized text in this response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        summary:
          description: Short human-readable summary of this result. Never reduce
            this response to a bare safe/unsafe claim -- read signals,
            domain_coverage, and review together.
          $ref: '#/components/schemas/LocalizedString'
        context_summary:
          description: Privacy-safe indication of whether request-supplied patient_context
            was applied to this check. Enterprise has no saved profile, so this never
            reports a saved-profile source; it never echoes raw patient_context values.
          type: object
          additionalProperties: false
          required:
          - status
          - missing_context_count
          - stale_context_count
          - contradiction_count
          properties:
            status:
              description: request_context_applied means at least one
                patient_context field was supplied and used; baseline_only means
                no patient_context was supplied, so only medication-level
                evaluation was performed.
              type: string
              enum:
              - request_context_applied
              - baseline_only
            missing_context_count:
              description: Count of patient-context fields relevant to the
                requested domains that were not supplied.
              type: integer
              minimum: 0
            stale_context_count:
              description: Count of supplied patient-context fields whose
                reference date makes them too old to be trusted as current
                (e.g. an old age_reference_date).
              type: integer
              minimum: 0
            contradiction_count:
              description: Count of supplied patient-context fields that
                conflict with each other (e.g. sex and pregnancy_status).
              type: integer
              minimum: 0
        signals:
          description: Safety signals raised across all requested domains. Empty
            does not mean "safe" -- check domain_coverage and unavailable_domains
            for what was actually evaluated.
          type: array
          items:
            $ref: '#/components/schemas/SafetySignal'
        domain_coverage:
          description: Per-domain evaluation status for every domain that was
            requested and could be evaluated.
          type: array
          items:
            $ref: '#/components/schemas/SafetyBoardDomainState'
          default: []
        unavailable_domains:
          description: Per-domain status for requested domains that could not be
            evaluated (e.g. insufficient context, domain not currently
            supported). Treat these as unknown, not as clear.
          type: array
          items:
            $ref: '#/components/schemas/SafetyBoardDomainState'
          default: []
        limitations:
          description: Caveats about this result's scope or confidence that
            should be surfaced alongside signals.
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          default: []
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        correction_anchors:
          description: Opaque anchors for reporting a correction against this
            result. Present for future correction-workflow use; treat entries as
            opaque.
          type: array
          items:
            type: object
            additionalProperties: false
          default: []
    EnterpriseStatus:
      type: object
      additionalProperties: false
      required:
      - request_id
      - schema_version
      - status
      - capabilities
      - supported_locales
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        supported_locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
          minItems: 2
    EnterpriseCapabilities:
      type: object
      additionalProperties: false
      required:
      - request_id
      - schema_version
      - status
      - capabilities
      - supported_locales
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        supported_locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
          minItems: 2
    AllergyResolution:
      type: object
      additionalProperties: false
      required: [request_id, schema_version, locale, items]
      properties:
        request_id: {type: string}
        schema_version: {type: string}
        locale: {$ref: '#/components/schemas/Locale'}
        items:
          type: array
          items: {type: object, additionalProperties: false}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        display_obligations: {$ref: '#/components/schemas/DisplayObligations'}
    AllergyFamilyList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: {type: array, items: {type: object, additionalProperties: false}}
        pagination: {$ref: '#/components/schemas/Pagination'}
        locale: {type: string}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
    AllergySubstanceList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: {type: array, items: {type: object, additionalProperties: false}}
        pagination: {$ref: '#/components/schemas/Pagination'}
        locale: {type: string}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
    PrescriptionUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, format: binary}
        pipeline_profile: {type: string, enum: [v5_fast, v7_smart, auto], default: auto}
        source: {type: string, default: web}
        device_id: {type: string}
        include_ddi: {type: boolean, default: true}
        include_allergy: {type: boolean, default: true}
        include_food: {type: boolean, default: false}
        include_meal: {type: boolean, default: false}
        include_dose: {type: boolean, default: false}
        include_clinical: {type: boolean, default: false}
        include_pllr: {type: boolean, default: false}
    PrescriptionCreated:
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, status, educational_context, source_provenance, review]
      properties:
        request_id: {type: string}
        prescription_id: {type: string}
        status: {type: string, enum: [accepted, processing]}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
    PrescriptionResult:
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, workflow_id, status, created_at, updated_at, transitions, locale, educational_context, source_provenance, review, candidate_medications, display_obligations]
      properties:
        request_id: {type: string}
        prescription_id: {type: string}
        workflow_id: {type: string}
        status: {type: string}
        pipeline_profile: {type: [string, 'null']}
        reason_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        transitions: {type: array, items: {type: object, additionalProperties: false}}
        locale: {type: string}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
        candidate_medications: {type: array, items: {type: object, additionalProperties: false}}
        display_obligations: {$ref: '#/components/schemas/DisplayObligations'}
    Locale:
      type: string
      enum:
      - ar-EG
      - ar
      - en
      - mixed
    LocalizedString:
      type: object
      additionalProperties: false
      required:
      - en
      - ar
      properties:
        en:
          type: string
          minLength: 1
        ar:
          type: string
          minLength: 1
        transliteration:
          type:
          - string
          - 'null'
        direction:
          type:
          - string
          - 'null'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - limit
      - has_more
      properties:
        limit:
          type: integer
        cursor:
          type:
          - string
          - 'null'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    SourceProvenance:
      description: Snapshot identifiers for the reference data used to produce this
        response. Does not describe internal model, resolver, or pipeline identity.
      type: object
      additionalProperties: false
      required:
      - registry_snapshot_id
      - safety_snapshot_id
      - policy_version
      - claim_catalog_version
      properties:
        registry_snapshot_id:
          type:
          - string
          - 'null'
        safety_snapshot_id:
          type:
          - string
          - 'null'
        policy_version:
          type: string
        claim_catalog_version:
          type:
          - string
          - 'null'
    DisplayObligations:
      type: object
      additionalProperties: false
      required:
      - must_show_educational_boundary
      - must_show_professional_review_language
      - must_show_source_snapshot
      - must_preserve_arabic_text
      - may_not_describe_as_medical_advice
      properties:
        must_show_educational_boundary:
          type: boolean
          const: true
        must_show_professional_review_language:
          type: boolean
        must_show_source_snapshot:
          type: boolean
          const: true
        must_preserve_arabic_text:
          type: boolean
          const: true
        must_preserve_rtl_layout:
          type: boolean
          default: true
        may_not_describe_as_medical_advice:
          type: boolean
          const: true
    EducationalContext:
      type: object
      additionalProperties: false
      required:
      - classification
      - not_medical_advice
      - not_dispensing_authorization
      - professional_review_required
      - basis
      - source_snapshot_id
      - generated_at
      - policy_version
      - claim_catalog_version
      - locale
      - supported_locales
      properties:
        classification:
          type: string
          const: pharmaceutical_education
        not_medical_advice:
          type: boolean
          const: true
        not_dispensing_authorization:
          type: boolean
          const: true
        professional_review_required:
          type: boolean
        basis:
          type: string
          enum:
          - curated_pharmaceutical_reference_data
        source_snapshot_id:
          type: string
          minLength: 1
        generated_at:
          type: string
          format: date-time
        policy_version:
          type: string
          minLength: 1
        claim_catalog_version:
          type: string
          minLength: 1
        locale:
          $ref: '#/components/schemas/Locale'
        supported_locales:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Locale'
    ReviewState:
      type: object
      additionalProperties: false
      required:
      - required
      - status
      - minimum_reviewer_role
      - review_deadline_policy
      properties:
        required:
          description: Whether professional review is required before this
            result may be relied upon.
          type: boolean
        status:
          description: Current review workflow state.
          type: string
          enum:
          - not_required
          - pending
          - in_review
          - reviewed_acknowledged
          - reviewed_needs_followup
          - dismissed_as_not_applicable
          - escalated
          - expired
        reason_codes:
          description: Machine-readable reasons review was triggered.
          type: array
          items:
            type: string
          default: []
        minimum_reviewer_role:
          description: Minimum reviewer qualification required to satisfy this
            review requirement.
          type: string
          enum:
          - none
          - trained_operator
          - qualified_professional
          - pharmaceutical_reviewer
        review_deadline_policy:
          description: When review must be completed relative to relying on or
            completing the workflow this result belongs to.
          type: string
          enum:
          - before_relying_on_output
          - before_workflow_completion
          - optional
          - not_applicable
        review_outcome:
          description: Recorded outcome once review has been performed; null
            until then.
          type:
          - string
          - 'null'
          enum:
          - acknowledged_for_professional_review
          - needs_followup
          - not_applicable_to_case
          - data_quality_issue_reported
          - ocr_correction_applied
          - null
        review_note:
          $ref: '#/components/schemas/LocalizedString'
        reviewed_at:
          description: When review_outcome was recorded; null until reviewed.
          type:
          - string
          - 'null'
          format: date-time
    SafetyBoardDomainState:
      type: object
      additionalProperties: false
      required:
      - domain
      - status
      - code
      properties:
        domain:
          description: Which of the six safety domains this state describes.
          type: string
          enum:
          - ddi
          - pllr
          - food_interactions
          - meal_timing
          - allergy
          - clinical_dose
        status:
          description: evaluated means the domain was actually assessed for this
            request; every other value means it was not, for the reason given --
            treat non-evaluated domains as unknown, not as clear.
          type: string
          enum:
          - evaluated
          - not_applicable
          - unknown
          - unmapped
          - not_enough_context
          - unavailable
          - failed
        code:
          description: Machine-readable reason code for this domain's status.
          type: string
        display_label:
          $ref: '#/components/schemas/LocalizedString'
        status_label:
          $ref: '#/components/schemas/LocalizedString'
    SafetySignal:
      type: object
      additionalProperties: false
      required:
      - signal_id
      - domain
      - severity
      - action_bucket
      - title
      - reason
      - justification
      - evidence_refs
      - confidence
      - review_required
      - source_provenance
      properties:
        signal_id:
          description: Stable identifier for this signal.
          type: string
        domain:
          description: Which of the six safety domains raised this signal.
          type: string
          enum:
          - ddi
          - pllr
          - food_interactions
          - meal_timing
          - allergy
          - clinical_dose
        severity:
          description: Canonical severity of this signal.
          type: string
          enum:
          - informational
          - low
          - moderate
          - high
          - critical
        action_bucket:
          description: Recommended action category. Use this, not severity alone,
            to decide how to surface the signal -- e.g. urgent_review demands
            stronger UI treatment than reference even within the same severity.
          type: string
          enum:
          - urgent_review
          - clarify_first
          - counsel
          - monitor
          - reference
        title:
          $ref: '#/components/schemas/LocalizedString'
        reason:
          $ref: '#/components/schemas/LocalizedString'
        justification:
          $ref: '#/components/schemas/LocalizedString'
        equivalent_options:
          description: Suggested equivalent alternatives, when available. Not
            present for every signal.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - display_name
            - equivalence_reason
            properties:
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              equivalence_reason:
                $ref: '#/components/schemas/LocalizedString'
          default: []
        evidence_refs:
          description: References backing this signal. Opaque identifiers, not
            fetchable content.
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
        confidence:
          description: Confidence in this specific signal, 0-1.
          type: number
          minimum: 0
          maximum: 1
        review_required:
          description: Whether this specific signal requires professional review,
            independent of the result-level review requirement.
          type: boolean
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        limitations:
          description: Caveats specific to this signal.
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          default: []
    MedicationResolution:
      type: object
      additionalProperties: false
      required:
      - request_id
      - result_id
      - schema_version
      - surface
      - locale
      - educational_context
      - source_provenance
      - query
      - candidates
      - review
      - limitations
      properties:
        request_id:
          type: string
        result_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        surface:
          type: string
          enum:
          - browser
          - enterprise_api
          - partner_api
        locale:
          $ref: '#/components/schemas/Locale'
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        query:
          type: object
          additionalProperties: false
          required:
          - raw_text
          properties:
            raw_text:
              type: string
            locale_hint:
              type:
              - string
              - 'null'
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - sfrx_id
            - label
            - score
            properties:
              sfrx_id:
                type: string
              label:
                $ref: '#/components/schemas/LocalizedString'
              score:
                type: number
                minimum: 0
                maximum: 1
        selected_candidate_id:
          type:
          - string
          - 'null'
        review:
          $ref: '#/components/schemas/ReviewState'
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
