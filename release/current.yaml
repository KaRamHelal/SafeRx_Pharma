release_id: enterprise-v1-2026.10.20
release_version: 2.0.4
status: available
publishable: true

api_contract:
  source: openapi/enterprise-v1.yaml
  openapi_version: 3.1.1
  operation_count: 16
  deferred_operation_count: 5
  authentication: saferx-hmac-sha256-v1
  response_policy: closed_schema

artifacts:
  python: saferx-pharma==2.0.4
  typescript: saferx-pharma-sdk@2.0.4
  csharp: SafeRx==2.0.4

hosted_mcp:
  status: preview
  endpoint: https://saferx.online/api/enterprise-mcp/v1/mcp
  protocol_version: '2025-06-18'
  transport: streamable_http
  tools: [resolve_medications, check_medication_safety, get_safety_capabilities]
  resources: []
  prompts: []
  promoted_at: '2026-08-15'

documentation:
  fern_instance: saferx.docs.buildwithfern.com
  custom_domain: docs.saferx.online

availability:
  plan: enterprise_free
  key_required: true

notes:
  - >-
    operation_count reflects only operations with a complete, live-verified success
    contract; deferred_operation_count lists operations with no backend implementation
    and no entitlement grant on any plan (403 API_KEY_NOT_ENTITLED for every caller) and
    therefore excluded from the public bundle, SDK clients, and docs until they have a
    real success schema and evidence (see openapi/enterprise-v1.yaml x-status).
  - >-
    2.0.4 -- enterprise_capabilities and enterprise_status are promoted to available
    (live-verified 2026-10-21 with their real schemas); the five remaining deferred
    operations deny unentitled callers with 403 API_KEY_NOT_ENTITLED and entitled callers
    of a disabled capability with 503 capability_unavailable; a retry with the same
    Idempotency-Key and body now returns the original result (X-SafeRx-Idempotent-Replay:
    true) and a different body is 409 quota.idempotency.conflict; SafetyCheckResponse
    declares every field production returns (context_sources, profile_context_version,
    approved_summary_template_id, correction_anchors, risk_display, title_origin,
    patient_context_attribution, LocalizedString.ar_normalized/eg_ar/source_locale,
    SourceProvenance.model_release_id/resolver_version/search_artifact_id).
  - >-
    2.0.4 -- a safety-check or resolve medication may be given by sfrx_id alone;
    dose_text, route and dosage_form select the registry product; a bare name is
    evaluated as its default systemic variant and the response says so
    (default_variant_selected, limitations, the new resolved_medications[]);
    frequency_text, which the backend always refused, is removed. Backend corrections
    shipped to production 2026-10-20 and verified live with the committed enterprise
    journey. See CHANGELOG.md [2.0.4].
  - >-
    2.0.3 -- Python and TypeScript clients re-sign every retry attempt (a reused nonce
    was rejected as a replay, so a retried 5xx ended as a hard denial); Postman
    collection rewritten to a working signer over reachable operations; contract
    corrections from an outside-developer blackbox pass against production
    (LocalizedString empty strings, provenance/pharmacology/warnings fields, the 401/403
    denial-code table). See CHANGELOG.md [2.0.3].
  - >-
    Hosted MCP is preview, with exactly the three tools listed above and no resources or
    prompts. The whole endpoint requires the mcp_standard entitlement, which
    enterprise_free includes.
  - >-
    The legacy stdio @saferx_pharma/mcp-server package remains internal_only and
    deprecated; it is not the supported MCP integration path.
  - >-
    This manifest is the public release identity only. It does not describe any account,
    plan, or entitlement other than the existing self-service free plan.
  - >-
    Blackbox-verified 2026-09-23 with a real signed key against production, using only
    the published packages, this repository, and docs.saferx.online (see CHANGELOG.md
    [2.0.3] for what that pass found and corrected).
