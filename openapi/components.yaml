          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        clinical_note:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
    AllergyPatientContextEntry:
      type: object
      additionalProperties: false
      description: Ready to pass as one patient_context.allergies[] entry of a safety check; it resolves to
        the same families there.
      required:
      - input_text
      properties:
        input_text:
          type: string
        resolved_family_id:
          type: string
        resolved_sfrx_id:
          type: string
    AllergyFamily:
      type: object
      additionalProperties: false
      required:
      - family_id
      - name
      - clinical_significance
      - aliases
      - member_ingredient_count
      - cross_reactive_families
      - patient_context_entry
      properties:
        family_id:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedString'
        description:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        clinical_significance:
          type: string
        clinical_note:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        aliases:
          type: object
          additionalProperties: false
          required:
          - en
          - ar
          properties:
            en:
              type: array
              items:
                type: string
            ar:
              type: array
              items:
                type: string
        member_ingredient_count:
          type: integer
          minimum: 0
        cross_reactive_families:
          type: array
          items:
            $ref: '#/components/schemas/AllergyCrossReactiveFamily'
        patient_context_entry:
          $ref: '#/components/schemas/AllergyPatientContextEntry'
    AllergyFamilyList:
      allOf:
      - $ref: '#/components/schemas/AllergyReferenceEnvelope'
      - type: object
        required:
        - items
        - pagination
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AllergyFamily'
          pagination:
            $ref: '#/components/schemas/Pagination'
    AllergyResolutionItem:
      type: object
      additionalProperties: false
      description: One allergy to resolve. Identifiers win over text; text matches exactly after normalisation.
      properties:
        client_allergy_id:
          type: string
          maxLength: 128
        input_text:
          type: string
          minLength: 1
          maxLength: 200
        family_id:
          type: string
        sfrx_id:
          type: string
          pattern: ^SRX-[0-9]{3}-[0-9]{6}$
        substance_id:
          type: string
          pattern: ^(family|ingredient|product):[A-Za-z0-9_-]{1,80}$
          description: A substance_id returned by GET /allergies/substances.
      anyOf:
      - required:
        - input_text
      - required:
        - family_id
      - required:
        - sfrx_id
      - required:
        - substance_id
    AllergyResolutionRequest:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
          default: en
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/AllergyResolutionItem'
    AllergyResolutionResult:
      type: object
      additionalProperties: false
      required:
      - status
      - families
      - candidate_count
      - cross_reactive_families
      properties:
        client_allergy_id:
          type:
          - string
          - 'null'
        input_text:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - normalized
          - ambiguous
          - unresolved
        match_kind:
          type:
          - string
          - 'null'
          enum:
          - family
          - ingredient
          - product
          - null
        families:
          type: array
          items:
            $ref: '#/components/schemas/AllergyFamilyRef'
        resolved_family_id:
          type:
          - string
          - 'null'
          description: Set only when exactly one family matched.
        resolved_sfrx_id:
          type:
          - string
          - 'null'
        resolved_substance_id:
          type:
          - string
          - 'null'
          description: The ingredient substance_id when an ingredient matched.
        matched_name:
          type:
          - string
          - 'null'
        candidate_count:
          type: integer
          minimum: 0
        cross_reactive_families:
          type: array
          items:
            $ref: '#/components/schemas/AllergyCrossReactiveFamily'
        patient_context_entry:
          oneOf:
          - $ref: '#/components/schemas/AllergyPatientContextEntry'
          - type: 'null'
    AllergyResolutionResponse:
      allOf:
      - $ref: '#/components/schemas/AllergyReferenceEnvelope'
      - type: object
        required:
        - items
        - limitations
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AllergyResolutionResult'
          limitations:
            type: array
            items:
              $ref: '#/components/schemas/LocalizedString'
    AllergySubstance:
      type: object
      additionalProperties: false
      required:
      - substance_id
      - kind
      - name
      - families
      - patient_context_entry
      properties:
        substance_id:
          type: string
          description: Opaque kind-prefixed identifier (family:, ingredient:, product:); pass it to POST /allergies/resolve.
        kind:
          type: string
          enum:
          - family
          - ingredient
          - product
        name:
          $ref: '#/components/schemas/LocalizedString'
        families:
          type: array
          items:
            $ref: '#/components/schemas/AllergyFamilyRef'
        sfrx_id:
          type:
          - string
          - 'null'
        generic_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        dosage_form:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        patient_context_entry:
          $ref: '#/components/schemas/AllergyPatientContextEntry'
    AllergySubstanceList:
      allOf:
      - $ref: '#/components/schemas/AllergyReferenceEnvelope'
      - type: object
        required:
        - items
        - pagination
        - query
        properties:
          query:
            type: string
          items:
            type: array
            items:
              $ref: '#/components/schemas/AllergySubstance'
          pagination:
            $ref: '#/components/schemas/Pagination'
    SafetyCheckRecord:
      type: object
      additionalProperties: false
      description: 'A stored Enterprise safety check (2026-10-25): what was submitted and what was returned.
        Kept 90 days and readable by any key of the owning organization; every other caller gets 404 enterprise.safety.check_not_found.'
      required:
      - request_id
      - check_id
      - kind
      - status
      - created_at
      - expires_at
      - inputs
      properties:
        request_id:
          type: string
        check_id:
          type: string
          pattern: ^chk_[0-9a-f]{32}$
        kind:
          type: string
          enum:
          - safety_check
          - erx_safety_check
          - batch_item
        status:
          type: string
          enum:
          - pending
          - completed
          - failed
          description: pending only for a batch item not yet evaluated.
        batch_id:
          type: string
        client_item_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        expires_at:
          type: string
          format: date-time
        inputs:
          description: The request as submitted (a safety check, an eRx check, or one batch item evaluated as a safety check).
          oneOf:
          - $ref: '#/components/schemas/ClientSafetyCheckRequest'
          - $ref: '#/components/schemas/ErxSafetyCheckRequest'
        result:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyCheckResult'
          - type: 'null'
        problem:
          description: For a failed batch item, the RFC 9457 problem it produced.
          $ref: '#/components/schemas/ProblemDetails'

    SafetyCheckBatchRequest:
      type: object
      additionalProperties: false
      description: An asynchronous batch of Enterprise safety checks (2026-10-25). Each item is evaluated
        exactly like POST /safety/checks (batch-level locale, requested_domains and patient_context apply
        unless the item sets its own). Charged one safety_boards unit per evaluated item; at most 100 items
        (request_size_limits).
      required:
      - requested_domains
      - items
      properties:
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
          default: en
        requested_domains:
          type: array
          uniqueItems: true
          minItems: 1
          maxItems: 6
          items:
            type: string
            enum:
            - pllr
            - ddi
            - clinical_dose
            - food_interactions
            - meal_timing
            - allergy
        patient_context:
          $ref: '#/components/schemas/PatientSafetyContext'
        idempotency_key:
          type:
          - string
          - 'null'
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required:
            - medications
            properties:
              client_item_id:
                type:
                - string
                - 'null'
                maxLength: 128
              medications:
                $ref: '#/components/schemas/ClientSafetyCheckRequest/properties/medications'
              patient_context:
                $ref: '#/components/schemas/PatientSafetyContext'
              requested_domains:
                type: array
                uniqueItems: true
                minItems: 1
                maxItems: 6
                items:
                  type: string
                  enum:
                  - pllr
                  - ddi
                  - clinical_dose
                  - food_interactions
                  - meal_timing
                  - allergy
    SafetyCheckBatchReceipt:
      type: object
      additionalProperties: false
      description: 'Returned with 202 when a batch is accepted. Every item already has its check_id; read
        results with GET /safety/checks/{check_id} (status pending until evaluated, then completed or failed).
        Units are settled when the batch finishes: one per evaluated item, nothing for a failed item.'
      required:
      - request_id
      - batch_id
      - status
      - item_count
      - items
      - result_retrieval
      properties:
        request_id:
          type: string
        batch_id:
          type: string
          pattern: ^bat_[0-9a-f]{32}$
        status:
          type: string
          enum:
          - accepted
        item_count:
          type: integer
          minimum: 1
          maximum: 100
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - client_item_id
            - check_id
            properties:
              client_item_id:
                type:
                - string
                - 'null'
              check_id:
                type: string
                pattern: ^chk_[0-9a-f]{32}$
        result_retrieval:
          type: string
    EvidenceReference:
      description: 'One evidence reference: its citation, evidence grade and the snapshot it was read from.'
      type: object
      additionalProperties: false
      required:
      - evidence_id
      - domain
      - source_snapshot_id
      - evidence_grade
      - citation_label
      - reason
      - justification
      properties:
        evidence_id:
          description: Stable identifier for this evidence entry.
          type: string
          minLength: 1
        domain:
          description: Which safety domain this evidence supports.
          type: string
          minLength: 1
        source_snapshot_id:
          description: Reference-data snapshot this evidence was drawn from.
          type: string
          minLength: 1
        evidence_grade:
          description: Strength/kind of this evidence.
          type: string
          enum:
          - curated_reference
          - primary_label
          - secondary_reference
          - local_policy
          - inferred_mapping
        citation_label:
          $ref: '#/components/schemas/LocalizedString'
        reason:
          $ref: '#/components/schemas/LocalizedString'
        justification:
          $ref: '#/components/schemas/LocalizedString'
        limitations:
          description: Caveats specific to this evidence entry.
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          default: []
    PrescriptionUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file:
          description: Prescription image to process.
          type: string
          format: binary
        pipeline_profile:
          description: Which OCR pipeline to use. v5_fast trades accuracy for
            speed; v7_smart trades speed for accuracy; auto lets the platform
            choose.
          type: string
          enum: [v5_fast, v7_smart, auto]
          default: auto
        source:
          description: Caller-declared source label for this upload, used for
            operational attribution only.
          type: string
          default: web
        device_id:
          description: Opaque caller-declared device identifier, used for
            operational attribution only.
          type: string
        include_ddi:
          description: Whether to include drug-drug interaction checking once
            this prescription reaches the safety-check step.
          type: boolean
          default: true
        include_allergy:
          description: Whether to include allergy checking once this
            prescription reaches the safety-check step.
          type: boolean
          default: true
        include_food:
          description: Whether to include food-interaction checking once this
            prescription reaches the safety-check step.
          type: boolean
          default: false
        include_meal:
          description: Whether to include meal-timing checking once this
            prescription reaches the safety-check step.
          type: boolean
          default: false
        include_dose:
          description: Whether to include clinical-dose checking once this
            prescription reaches the safety-check step.
          type: boolean
          default: false
        include_clinical:
          description: Whether to include general clinical checks once this
            prescription reaches the safety-check step.
          type: boolean
          default: false
        include_pllr:
          description: Whether to include pregnancy/lactation checking once this
            prescription reaches the safety-check step.
          type: boolean
          default: false
    PrescriptionCreated:
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, status, educational_context, source_provenance, review]
      properties:
        request_id: {description: 'Echo of the request identifier for correlation.', type: string}
        prescription_id: {description: 'Identifier for the created prescription workflow. Use this with every subsequent lifecycle call.', type: string}
        status: {description: 'Initial workflow status immediately after upload.', type: string, enum: [accepted, processing]}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
    PrescriptionResult:
      description: candidate_medications and document_context were corrected
        against the real backend response contract -- candidate_medications was
        typed as an always-empty object, which would have rejected every real
        response once resolution had actually run, and document_context was
        missing entirely despite being required.
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, workflow_id, status, created_at, updated_at, transitions, locale, educational_context, source_provenance, review, candidate_medications, document_context, display_obligations]
      properties:
        request_id: {description: 'Echo of the request identifier for correlation.', type: string}
        prescription_id: {description: 'Identifier for this prescription workflow.', type: string}
        workflow_id: {description: 'Identifier for the specific workflow run processing this prescription.', type: string}
        status: {description: 'Current workflow status. Poll this or subscribe to the events endpoint rather than assuming a fixed processing time.', type: string}
        pipeline_profile: {description: 'Which OCR pipeline processed this prescription.', type: [string, 'null']}
        reason_code: {description: 'Machine-readable reason for the current status, when applicable (e.g. why processing failed).', type: [string, 'null']}
        created_at: {description: 'When this prescription workflow was created.', type: string, format: date-time}
        updated_at: {description: 'When this prescription workflow last changed state.', type: string, format: date-time}
        transitions:
          description: History of workflow state transitions.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [event_type, payload, occurred_at]
            properties:
              event_type:
                description: What kind of transition this was.
                type: string
              from_state:
                description: Workflow status before this transition, when
                  applicable.
                type: [string, 'null']
              to_state:
                description: Workflow status after this transition, when
                  applicable.
                type: [string, 'null']
              reason_code:
                description: Machine-readable reason for this transition, when
                  applicable.
                type: [string, 'null']
              payload:
                description: Additional detail specific to this event_type. Shape
                  varies by event_type and is not further specified.
                type: object
                additionalProperties: false
              occurred_at:
                description: When this transition occurred.
                type: string
                format: date-time
        locale: {description: 'Locale used for localized text in this response.', type: string}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
        document_context:
          description: Classification of the uploaded document itself, before
            per-line medication resolution.
          type: object
          additionalProperties: false
          properties:
            document_type:
              description: What kind of document this was classified as.
              type: [string, 'null']
            is_prescription:
              description: Whether the uploaded image was classified as a
                prescription.
              type: [boolean, 'null']
            medications_present:
              description: Whether any medications were detected in the
                document.
              type: [boolean, 'null']
            medication_section:
              description: Which part of the document the medication list was
                found in, when applicable.
              type: [string, 'null']
        candidate_medications:
          description: One entry per recognized medication line on the
            prescription. Empty until OCR/resolution has run.
          type: array
          items:
            type: object
            additionalProperties: false
            required: [line_id, position, raw_span, ocr_candidates, alternatives, review_required, review_state]
            properties:
              line_id:
                description: Identifier for this recognized line.
                type: string
              position:
                description: Position of this line within the document.
                type: integer
                minimum: 0
              raw_span:
                description: Raw OCR text span this line was recognized from.
                type: string
              winner:
                description: The selected medication for this line, once
                  resolution has chosen one.
                oneOf:
                - type: object
                  additionalProperties: false
                  required: [display_name, review_state]
                  properties:
                    sfrx_id:
                      description: Registry identifier, when resolved to a known
                        product.
                      type: [string, 'null']
                    display_name:
                      $ref: '#/components/schemas/LocalizedString'
                    generic:
                      description: Generic/INN name, when known.
                      oneOf:
                      - $ref: '#/components/schemas/LocalizedString'
                      - type: 'null'
                    final_score:
                      description: Confidence this is the correct match, 0-1.
                      type: [number, 'null']
                      minimum: 0
                      maximum: 1
                    confidence:
                      description: OCR recognition confidence for this line, 0-1.
                      type: [number, 'null']
                      minimum: 0
                      maximum: 1
                    review_state:
                      description: Review state for this specific line.
                      type: string
                - type: 'null'
              ocr_candidates:
                description: Raw OCR readings for this line, ranked.
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [rank, recognized_text]
                  properties:
                    rank:
                      description: Rank of this OCR reading for the line.
                      type: integer
                      minimum: 1
                    recognized_text:
                      description: Text as recognized by OCR.
                      type: string
                    locale:
                      description: Locale of the recognized text, when detected.
                      type: [string, 'null']
                    confidence:
                      description: OCR recognition confidence, 0-1.
                      type: [number, 'null']
                      minimum: 0
                      maximum: 1
              alternatives:
                description: Alternative medication matches for this line, ranked.
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [rank, display_name, selection_reason]
                  properties:
                    rank:
                      description: Rank of this alternative.
                      type: integer
                      minimum: 1
                    sfrx_id:
                      description: Registry identifier, when known.
                      type: [string, 'null']
                    display_name:
                      $ref: '#/components/schemas/LocalizedString'
                    generic:
                      description: Generic/INN name, when known.
                      oneOf:
                      - $ref: '#/components/schemas/LocalizedString'
                      - type: 'null'
                    final_score:
                      description: Confidence this alternative matches, 0-1.
                      type: [number, 'null']
                      minimum: 0
                      maximum: 1
                    selection_reason:
                      description: Why this alternative was surfaced.
                      type: string
                      enum: [ocr_alternative_match, same_generic_name]
              review_required:
                description: Whether this specific line requires professional
                  review.
                type: boolean
              review_state:
                description: Current review state for this line.
                type: string
              correction_anchor_id:
                description: Opaque anchor for reporting a correction against
                  this line.
                type: [string, 'null']
        display_obligations: {$ref: '#/components/schemas/DisplayObligations'}
    Locale:
      type: string
      enum:
      - ar-EG
      - ar
      - en
      - mixed
    LocalizedString:
      description: Bilingual display text. Always render according to the
        caller's chosen locale; do not concatenate en and ar.
      type: object
      additionalProperties: false
      required:
      - en
      - ar
      properties:
        en:
          description: English text. An empty string means no English text
            exists for this field in the registry (for example the route of a
            product whose source record only carries Arabic); render the other
            language or omit the field rather than treating it as an error.
          type: string
        ar:
          description: Arabic text. An empty string means no Arabic text exists
            for this field in the registry; see `en`.
          type: string
        transliteration:
          description: Latin transliteration of the Arabic text, when available.
          type:
          - string
          - 'null'
        direction:
          description: Text direction hint for rendering, when it differs from
            the locale default.
          type:
          - string
          - 'null'
        ar_normalized:
          description: Normalized Arabic rendering used for matching and display
            fallbacks, or null. (Declared 2.0.4; production returns it on safety
            texts.)
          type:
          - string
          - 'null'
        eg_ar:
          description: Egyptian-Arabic rendering when it differs from `ar`, or null.
            (Declared 2.0.4.)
          type:
          - string
          - 'null'
        source_locale:
          description: Locale the text was authored in, or null. (Declared 2.0.4.)
          type:
          - string
          - 'null'
    Pagination:
      description: Cursor-based pagination state.
      type: object
      additionalProperties: false
      required:
      - limit
      - has_more
      properties:
        limit:
          description: Page size used for this response.
          type: integer
        cursor:
          description: Cursor that produced this page, when one was supplied.
          type:
          - string
          - 'null'
        next_cursor:
          description: Cursor to request the next page. Null when has_more is
            false.
          type:
          - string
          - 'null'
        has_more:
          description: Whether more results exist beyond this page.
          type: boolean
    SourceProvenance:
      description: Snapshot identifiers for the reference data used to produce this
        response. Does not describe internal model, resolver, or pipeline identity.
      type: object
      additionalProperties: false
      required:
      - registry_snapshot_id
      - safety_snapshot_id
      - policy_version
      - claim_catalog_version
      properties:
        registry_snapshot_id:
          description: Registry data snapshot used, when this response drew on
            registry data.
          type:
          - string
          - 'null'
        safety_snapshot_id:
          description: Safety data snapshot used, when this response drew on
            safety data.
          type:
          - string
          - 'null'
        policy_version:
          description: Policy version applied to this response.
          type: string
        claim_catalog_version:
          description: Claim catalog version applied to this response, when
            applicable.
          type:
          - string
          - 'null'
        arabic_content_snapshot_id:
          description: Arabic content snapshot used for the Arabic text in this
            response, when the response carries registry content.
          type:
          - string
          - 'null'
        model_release_id:
          description: Release identifier of the clinical model that produced the
            content, or null when none applies. (Declared 2.0.4.)
          type:
          - string
          - 'null'
        resolver_version:
          description: Version of the medication resolver that identified the
            products, or null. (Declared 2.0.4.)
          type:
          - string
          - 'null'
        search_artifact_id:
          description: Identifier of the registry search artifact used, or null.
            (Declared 2.0.4.)
          type:
          - string
          - 'null'
    CorrectionAnchor:
      description: Opaque handle identifying one element of a response (a signal,
        a recommendation, an evidence reference, a provenance block, a resolved
        candidate) for a future correction-reporting workflow. Treat it as opaque;
        only `correction_anchor_id` and the `target_*` fields are stable. (Declared
        2.0.4; production returns these on every safety signal.)
      type: object
      additionalProperties: false
      required:
      - correction_anchor_id
      - target_type
      - target_field_path
      - target_label
      - locale
      properties:
        correction_anchor_id:
          type: string
        target_type:
          type: string
        target_field_path:
          type: string
        target_label:
          $ref: '#/components/schemas/LocalizedString'
        locale:
          $ref: '#/components/schemas/Locale'
        domain:
          type: string
        signal_id:
          type: string
        evidence_id:
          type: string
        sfrx_id:
          type: string
        registry_snapshot_id:
          type: string
        safety_release_id:
          type: string
    DisplayObligations:
      description: Display requirements the caller must honor when presenting
        this response to an end user.
      type: object
      additionalProperties: false
      required:
      - must_show_educational_boundary
      - must_show_professional_review_language
      - must_show_source_snapshot
      - must_preserve_arabic_text
      - may_not_describe_as_medical_advice
      properties:
        must_show_educational_boundary:
          description: Always true. The educational-content boundary must be
            shown alongside this response wherever it's displayed.
          type: boolean
          const: true
        must_show_professional_review_language:
          description: Whether professional-review language must be shown
            alongside this response.
          type: boolean
        must_show_source_snapshot:
          description: Always true. The source snapshot/version must be
            attributable in the display.
          type: boolean
          const: true
        must_preserve_arabic_text:
          description: Always true. Arabic text must be displayed as returned,
            not machine-translated or altered.
          type: boolean
          const: true
        must_preserve_rtl_layout:
          description: Whether right-to-left layout must be preserved for Arabic
            content.
          type: boolean
          default: true
        may_not_describe_as_medical_advice:
          description: Always true. This response must never be presented as
            medical advice or a dispensing authorization.
          type: boolean
          const: true
        approved_summary_template_id:
          description: Identifier of the approved wording template used for the
            summary, or null when none applies. Informational. (Declared 2.0.4;
            production always returned it.)
          type:
          - string
          - 'null'
    EducationalContext:
      description: Fixed educational-content framing attached to every response.
        Establishes that responses are pharmaceutical education, not medical
        advice or a dispensing authorization.
      type: object
      additionalProperties: false
      required:
      - classification
      - not_medical_advice
      - not_dispensing_authorization
      - professional_review_required
      - basis
      - source_snapshot_id
      - generated_at
      - policy_version
      - claim_catalog_version
      - locale
      - supported_locales
      properties:
        classification:
          description: Always pharmaceutical_education.
          type: string
          const: pharmaceutical_education
        not_medical_advice:
          description: Always true.
          type: boolean
          const: true
        not_dispensing_authorization:
          description: Always true.
          type: boolean
          const: true
        professional_review_required:
          description: Whether this response's domain requires professional
            review before being relied upon.
          type: boolean
        basis:
          description: The reference-data basis for this response.
          type: string
          enum:
          - curated_pharmaceutical_reference_data
        source_snapshot_id:
          description: Identifier for the reference-data snapshot this response
            was generated from.
          type: string
          minLength: 1
        generated_at:
          description: When this response was generated.
          type: string
          format: date-time
        policy_version:
          description: Policy version applied to this response.
          type: string
          minLength: 1
        claim_catalog_version:
          description: Claim catalog version applied to this response.
          type: string
          minLength: 1
        locale:
          $ref: '#/components/schemas/Locale'
        supported_locales:
          description: Locales this response's content is available in.
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Locale'
    ReviewState:
      type: object
      additionalProperties: false
      required:
      - required
      - status
      - minimum_reviewer_role
      - review_deadline_policy
      properties:
        required:
          description: Whether professional review is required before this
            result may be relied upon.
          type: boolean
        status:
          description: Current review workflow state.
          type: string
          enum:
          - not_required
          - pending
          - in_review
          - reviewed_acknowledged
          - reviewed_needs_followup
          - dismissed_as_not_applicable
          - escalated
          - expired
        reason_codes:
          description: Machine-readable reasons review was triggered.
          type: array
          items:
            type: string
          default: []
        minimum_reviewer_role:
          description: Minimum reviewer qualification required to satisfy this
            review requirement.
          type: string
          enum:
          - none
          - trained_operator
          - qualified_professional
          - pharmaceutical_reviewer
        review_deadline_policy:
          description: When review must be completed relative to relying on or
            completing the workflow this result belongs to.
          type: string
          enum:
          - before_relying_on_output
          - before_workflow_completion
          - optional
          - not_applicable
        review_outcome:
          description: Recorded outcome once review has been performed; null
            until then.
          type:
          - string
          - 'null'
          enum:
          - acknowledged_for_professional_review
          - needs_followup
          - not_applicable_to_case
          - data_quality_issue_reported
          - ocr_correction_applied
          - null
        review_note:
          $ref: '#/components/schemas/LocalizedString'
        reviewed_at:
          description: When review_outcome was recorded; null until reviewed.
          type:
          - string
          - 'null'
          format: date-time
    MedicationResolution:
      type: object
      additionalProperties: false
      required:
      - request_id
      - result_id
      - schema_version
      - surface
      - locale
      - educational_context
      - source_provenance
      - query
      - candidates
      - review
      - limitations
      properties:
        request_id:
          description: Echo of the request identifier for correlation.
          type: string
        result_id:
          description: Stable identifier for this specific resolution result.
          type: string
        schema_version:
          description: Semantic version of this response's schema shape.
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        surface:
          description: Which SafeRx surface produced this result. Always
            enterprise_api for calls made through this API.
          type: string
          enum:
          - browser
          - enterprise_api
          - partner_api
        locale:
          $ref: '#/components/schemas/Locale'
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        query:
          description: Echo of the input that was resolved.
          type: object
          additionalProperties: false
          required:
          - raw_text
          properties:
            raw_text:
              description: The free-text medication description that was
                resolved.
              type: string
            locale_hint:
              description: Locale hint supplied with the original input, if any.
              type:
              - string
              - 'null'
        candidates:
          description: Ranked resolution candidates. Empty means no confident
            match was found -- do not treat that as "no product exists." Rebuilt
            to match the real backend response contract -- the previous version
            invented a {sfrx_id, label, score} shape no real response ever
            returned.
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - candidate_id
            - sfrx_id
            - confidence
            - display_name
            - normalized_name
            - review
            - source_provenance
            properties:
              candidate_id:
                description: Stable identifier for this candidate within the
                  resolution result.
                type: string
              sfrx_id:
                description: Registry identifier for this candidate.
                type: string
              registry_concept_id:
                description: Registry concept identifier, when this candidate
                  is backed by a concept rather than a single product.
                type:
                - string
                - 'null'
              confidence:
                description: Confidence this candidate matches the input, 0-1.
                  Not comparable across different queries.
                type: number
                minimum: 0
                maximum: 1
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              normalized_name:
                $ref: '#/components/schemas/LocalizedString'
              strength:
                description: Strength as printed on the product, not structured.
                type:
                - string
                - 'null'
              dosage_form:
                description: Dosage form, when known.
                oneOf:
                - $ref: '#/components/schemas/LocalizedString'
                - type: 'null'
              route:
                description: Administration route, when known.
                oneOf:
                - $ref: '#/components/schemas/LocalizedString'
                - type: 'null'
              manufacturer:
                description: Manufacturer name, when known.
                oneOf:
                - $ref: '#/components/schemas/LocalizedString'
                - type: 'null'
              ingredient_names:
                description: Active ingredient names for this candidate.
                type: array
                items:
                  $ref: '#/components/schemas/LocalizedString'
              match_reasons:
                description: Human-readable reasons this candidate matched
                  the input.
                type: array
                items:
                  $ref: '#/components/schemas/LocalizedString'
              equivalent_candidates:
                description: Other candidate_ids considered equivalent to
                  this one for resolution purposes.
                type: array
                items:
                  type: string
              review:
                $ref: '#/components/schemas/ReviewState'
              source_provenance:
                $ref: '#/components/schemas/SourceProvenance'
        selected_candidate_id:
          description: sfrx_id of the candidate to treat as selected, when
            resolution is confident enough to auto-select one. Null when the
            caller must choose among candidates.
          type:
          - string
          - 'null'
        review:
          $ref: '#/components/schemas/ReviewState'
        limitations:
          description: Caveats about this resolution's scope or confidence.
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
    EnterpriseSafetyCheckResult:
      description: 'Public Enterprise safety-check result, schema_version 2 (2026-10-26). Built field by field by packages/common/safety_public_v2.py;
        every text is exactly {en, ar}; a value the sources do not state is null. Decision: docs/decisions/2026-10-26--enterprise-safety-response-v2-in-place.md.'
      type: object
      additionalProperties: false
      required:
      - schema_version
      - check_id
      - request_id
      - created_at
      - outcome
      - release
      - medications
      - domains
      - findings
      - review
      - patient_context
      - disclaimer
      properties:
        schema_version:
          const: 2
        check_id:
          type: string
          pattern: ^chk_[0-9a-f]{32}$
        request_id:
          type: string
        created_at:
          type: string
          format: date-time
        outcome:
          type: object
          additionalProperties: false
          required:
          - highest_severity
          - action
          - finding_count
          - alert_count
          - blocked
          properties:
            highest_severity:
              oneOf:
              - type: string
                enum:
                - informational
                - low
                - moderate
                - high
                - critical
              - type: 'null'
            action:
              oneOf:
              - type: string
                enum:
                - urgent_review
                - clarify_first
                - counsel
                - monitor
                - reference
              - type: 'null'
            finding_count:
              type: integer
              minimum: 0
            alert_count:
              type: integer
              minimum: 0
            blocked:
              type: boolean
        release:
          type: object
          additionalProperties: false
          required:
          - safety_snapshot_id
          - registry_snapshot_id
          properties:
            safety_snapshot_id:
              type:
              - string
              - 'null'
            registry_snapshot_id:
              type:
              - string
              - 'null'
        medications:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseSafetyMedicationResult'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseSafetyDomainResult'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseSafetyFinding'
        review:
          type: object
          additionalProperties: false
          required:
          - required
          - reasons
          - minimum_reviewer_role
          properties:
            required:
              type: boolean
            reasons:
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - code
                - message
                properties:
                  code:
                    type: string
                  message:
                    oneOf:
                    - $ref: '#/components/schemas/EnterpriseSafetyText'
                    - type: 'null'
            minimum_reviewer_role:
              type:
              - string
              - 'null'
        patient_context:
          type: object
          additionalProperties: false
          required:
          - status
          - applied_fields
          properties:
            status:
              type: string
              enum:
              - applied
              - none
            applied_fields:
              type: array
              items:
                type: string
        disclaimer:
          $ref: '#/components/schemas/EnterpriseSafetyText'
        erx:
          type: object
          additionalProperties: false
          required:
          - prescription_ref
          - lines
          properties:
            prescription_ref:
              type:
              - string
              - 'null'
            lines:
              type: array
              items:
                $ref: '#/components/schemas/EnterpriseSafetyErxLine'
    EnterpriseSafetyText:
      type: object
      additionalProperties: false
      required:
      - en
      - ar
      properties:
        en:
          type: string
          minLength: 1
        ar:
          type: string
          minLength: 1
    EnterpriseSafetyProduct:
      type: object
      additionalProperties: false
      required:
      - sfrx_id
      - name
      - generic
      - strength
      - form
      properties:
        sfrx_id:
          type: string
          pattern: ^SRX-[0-9]{3}-[0-9]{6}$
        name:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        generic:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        strength:
          type:
          - string
          - 'null'
        form:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
    EnterpriseSafetyCandidate:
      type: object
      additionalProperties: false
      required:
      - sfrx_id
      - name
      - strength
      - form
      properties:
        sfrx_id:
          type: string
        name:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        strength:
          type:
          - string
          - 'null'
        form:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
    EnterpriseSafetyMedicationResult:
      type: object
      additionalProperties: false
      required:
      - ref
      - role
      - input
      - status
      properties:
        ref:
          type: string
        role:
          type: string
          enum:
          - new
          - current
        input:
          type: string
        status:
          type: string
          enum:
          - resolved
          - ambiguous
          - unresolved
        selection:
          type: string
          enum:
          - exact
          - by_id
          - default_variant
          - equivalent_product
        product:
          $ref: '#/components/schemas/EnterpriseSafetyProduct'
        candidates:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/EnterpriseSafetyCandidate'
        reason:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
      allOf:
      - if:
          properties:
            status:
              const: resolved
        then:
          required:
          - selection
          - product
        else:
          required:
          - reason
    EnterpriseSafetyDomainResult:
      type: object
      additionalProperties: false
      required:
      - domain
      - name
      - status
      - finding_count
      - reason
      - missing_context
      - release_id
      properties:
        domain:
          type: string
          enum:
          - ddi
          - pllr
          - clinical_dose
          - food_interactions
          - meal_timing
          - allergy
        name:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        status:
          type: string
          enum:
          - evaluated
          - reference_only
          - not_applicable
          - not_enough_context
          - unmapped
          - unavailable
          - failed
        finding_count:
          type: integer
          minimum: 0
        reason:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        missing_context:
          type: array
          items:
            type: string
        release_id:
          type:
          - string
          - 'null'
    EnterpriseSafetySubject:
      type: object
      additionalProperties: false
      required:
      - type
      - code
      - name
      properties:
        type:
          type: string
          enum:
          - allergen
          - food
          - meal
          - population
        code:
          type:
          - string
          - 'null'
        name:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
    EnterpriseSafetyEvidence:
      type: object
      additionalProperties: false
      required:
      - grade
      - source
      - source_rating
      properties:
        grade:
          type: string
          enum:
          - primary_label
          - curated_reference
          - secondary_reference
          - local_policy
          - unrated
        source:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        source_rating:
          oneOf:
          - type: object
            additionalProperties: false
            required:
            - value
            - label
            properties:
              value:
                type:
                - integer
                - number
                - string
                - 'null'
              label:
                $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
    EnterpriseSafetyFinding:
      type: object
      additionalProperties: false
      required:
      - finding_id
      - domain
      - kind
      - severity
      - action
      - title
      - explanation
      - recommendation
      - medication_refs
      - subjects
      - evidence
      - confidence
      - based_on_context
      - review_required
      properties:
        finding_id:
          type: string
          minLength: 1
        domain:
          type: string
          enum:
          - ddi
          - pllr
          - clinical_dose
          - food_interactions
          - meal_timing
          - allergy
        kind:
          type: string
          enum:
          - alert
          - reference
        severity:
          type: string
          enum:
          - informational
          - low
          - moderate
          - high
          - critical
        action:
          type: string
          enum:
          - urgent_review
          - clarify_first
          - counsel
          - monitor
          - reference
        title:
          $ref: '#/components/schemas/EnterpriseSafetyText'
        explanation:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        recommendation:
          oneOf:
          - $ref: '#/components/schemas/EnterpriseSafetyText'
          - type: 'null'
        medication_refs:
          type: array
          items:
            type: string
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/EnterpriseSafetySubject'
        evidence:
          $ref: '#/components/schemas/EnterpriseSafetyEvidence'
        confidence:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 1
        based_on_context:
          type: array
          items:
            type: string
        review_required:
          type: boolean
    EnterpriseSafetyErxLine:
      type: object
      additionalProperties: false
      required:
      - line_ref
      - medication_ref
      - sfrx_id
      - status
      - frequency_text
      - duration_text
      properties:
        line_ref:
          type: string
        medication_ref:
          type: string
        sfrx_id:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - resolved
          - ambiguous
          - unresolved
        frequency_text:
          type:
          - string
          - 'null'
        duration_text:
          type:
          - string
          - 'null'
