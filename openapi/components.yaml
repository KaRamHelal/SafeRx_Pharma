openapi: 3.1.1
info:
  title: SafeRx Enterprise Public Components
  version: 2.0.2-preview.1
paths: {}
components:
  securitySchemes:
    enterpriseApiKey:
      type: apiKey
      in: header
      name: X-SafeRx-API-Key
      description: API key used as the HMAC signing secret. X-SafeRx-Timestamp, X-SafeRx-Nonce,
        and X-SafeRx-Signature are also required.
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sfrxId:
      name: sfrx_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^SRX-[0-9]{3}-[0-9]{6}$
    signedNonce:
      name: X-SafeRx-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    signedSignature:
      name: X-SafeRx-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    signedTimestamp:
      name: X-SafeRx-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
  schemas:
    ClientSafetyCheckRequest:
      description: Enterprise safety-check input is request-scoped only. There is no
        server-held saved profile for this surface -- every patient factor considered
        for a check must be supplied explicitly on the request.
      type: object
      required:
      - medications
      - locale
      - requested_domains
      properties:
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        medications:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - input_text
            properties:
              client_medication_id:
                type:
                - string
                - 'null'
              input_text:
                type: string
                minLength: 1
              sfrx_id:
                type:
                - string
                - 'null'
                pattern: ^SRX-[0-9]{3}-[0-9]{6}$
              dose_text:
                type:
                - string
                - 'null'
              route:
                type:
                - string
                - 'null'
              frequency_text:
                type:
                - string
                - 'null'
              role:
                description: Which medication role this entry plays in the check.
                  target_medication is the medication under review; current_medication
                  marks a concurrently taken medication supplied for interaction
                  checking. Defaults to target_medication.
                type: string
                enum:
                - target_medication
                - current_medication
                default: target_medication
        patient_context:
          $ref: '#/components/schemas/PatientSafetyContext'
        requested_domains:
          type: array
          items:
            type: string
            enum:
            - pllr
            - ddi
            - clinical_dose
            - food_interactions
            - meal_timing
            - allergy
          uniqueItems: true
        idempotency_key:
          type:
          - string
          - 'null'
      additionalProperties: false
    PatientSafetyContext:
      description: Optional patient factors considered for this single request only.
        Enterprise never reads or writes a saved profile; omitted fields are treated
        as unknown, not as "no risk factor present".
      type: object
      additionalProperties: false
      properties:
        age_years:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 150
        date_of_birth:
          type:
          - string
          - 'null'
          format: date
        age_reference_date:
          type:
          - string
          - 'null'
          format: date
        sex:
          type:
          - string
          - 'null'
          enum:
          - female
          - male
          - intersex
          - unknown
          - null
        weight_kg:
          type:
          - number
          - 'null'
          minimum: 0
        pregnancy_status:
          type:
          - string
          - 'null'
          enum:
          - pregnant
          - not_pregnant
          - unknown
          - not_applicable
          - null
        lactation_status:
          type:
          - string
          - 'null'
          enum:
          - lactating
          - not_lactating
          - unknown
          - not_applicable
          - null
        pregnancy_context:
          type: object
          additionalProperties: false
          properties:
            lmp_date:
              type:
              - string
              - 'null'
              format: date
            gestational_age_reference_date:
              type:
              - string
              - 'null'
              format: date
            gestational_age_weeks:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 45
            gestational_age_months_approx:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 11
        lactation_context:
          type: object
          additionalProperties: false
          properties:
            infant_age_reference_date:
              type:
              - string
              - 'null'
              format: date
            infant_age_days:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 3650
            infant_age_months_approx:
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 120
        renal:
          type: object
          additionalProperties: false
          properties:
            crcl_ml_min:
              type:
              - number
              - 'null'
              minimum: 0
            egfr_ml_min_1_73m2:
              type:
              - number
              - 'null'
              minimum: 0
            status:
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - failure
              - dialysis
              - unknown
              - null
        hepatic:
          type: object
          additionalProperties: false
          properties:
            child_pugh:
              type:
              - string
              - 'null'
              enum:
              - A
              - B
              - C
              - unknown
              - null
            status:
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - unknown
              - null
        conditions:
          type: array
          maxItems: 50
          items:
            type: string
            enum:
            - arrhythmia
            - asthma
            - bph
            - coronary
            - depression
            - diabetes
            - epilepsy
            - gi_bleeding
            - glaucoma
            - heart_failure
            - hypertension
            - hyperthyroidism
            - hypothyroidism
            - parkinsons
        allergy_state:
          type:
          - string
          - 'null'
          description: Explicitly distinguishes unknown allergies from confirmed no
            known allergies.
          enum:
          - unknown
          - confirmed_none
          - has_entries
          - null
        allergies:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - input_text
            properties:
              input_text:
                type: string
              entry_type:
                type:
                - string
                - 'null'
                enum:
                - free_text
                - family
                - product
                - null
        diet_profile:
          type: object
          additionalProperties: false
          properties:
            diet_patterns:
              type: array
              uniqueItems: true
              maxItems: 20
              items:
                type: string
                enum:
                - vegetarian
                - vegan
                - pescatarian
                - keto_low_carb
                - high_protein_fitness
                - mediterranean
                - dash_low_sodium
                - diabetes_carb_managed
                - renal_modified
                - gluten_free
                - lactose_or_cow_milk_free
                - low_fodmap
                - low_purine
                - halal
                - kosher
                - ramadan_fasting
                - intermittent_fasting
                - other
            fasting_pattern:
              type:
              - string
              - 'null'
              enum:
              - none
              - ramadan
              - intermittent_fasting
              - time_restricted_eating
              - unknown
              - null
            food_exposures:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    type: string
                    enum:
                    - alcohol
                    - grapefruit_citrus
                    - dairy_calcium
                    - vitamin_k_leafy_greens
                    - caffeine
                    - tyramine_aged_fermented
                    - potassium_foods_or_salt_substitute
                    - high_fiber
                    - high_fat_meal
                    - licorice
                    - green_tea
                    - hibiscus
                    - black_seed
                    - fenugreek
                    - fava_beans
                    - other
                  confirmation_state:
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
            supplement_exposures:
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    type: string
                    enum:
                    - protein_powder_whey_casein
                    - calcium
                    - iron
                    - magnesium
                    - potassium_or_electrolyte
                    - caffeine_preworkout
                    - creatine
                    - herbal_supplement
                    - other
                  confirmation_state:
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
    IngredientList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - display_obligations
      - items
      - pagination
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          type: array
          items:
            type: object
            required:
            - ingredient_id
            - ingredient_type
            - display_name
            - linked_product_count
            - linked_sfrx_ids
            properties:
              ingredient_id:
                type: string
              ingredient_type:
                type: string
                enum:
                - active
                - generic_component
                - therapeutic_class
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              linked_product_count:
                type: integer
                minimum: 0
              linked_sfrx_ids:
                type: array
                items:
                  type: string
              correction_anchors:
                type: array
                items:
                  type: object
                  additionalProperties: false
            additionalProperties: false
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    MedicationResolutionList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          type: array
          items:
            $ref: '#/components/schemas/MedicationResolution'
      additionalProperties: false
    MedicationResolutionRequest:
      type: object
      required:
      - request_id
      - schema_version
      - educational_context
      - source_provenance
      - locale
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        summary:
          $ref: '#/components/schemas/LocalizedString'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    ProblemDetails:
      type: object
      required:
      - type
      - title
      - status
      - request_id
      - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        request_id:
          type: string
        code:
          type: string
        retry_after_seconds:
          type:
          - integer
          - 'null'
        retry_after:
          description: Compatibility projection of Retry-After in seconds for existing
            web clients.
          type:
          - integer
          - 'null'
          minimum: 0
        quota_metric:
          type:
          - string
          - 'null'
        rate_limit:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            limit:
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              type:
              - integer
              - 'null'
              minimum: 0
            reset:
              type:
              - integer
              - 'null'
              minimum: 0
        quota:
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            metric:
              type:
              - string
              - 'null'
            limit:
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              type:
              - integer
              - 'null'
              minimum: 0
            reset_at:
              type:
              - string
              - 'null'
              format: date-time
            window_seconds:
              type:
              - integer
              - 'null'
              minimum: 0
        safe_to_retry:
          type: boolean
      additionalProperties: false
    RegistryProductDetail:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - display_obligations
      - sfrx_id
      - product_tier
      - display_name
      - generic_components
      - dosage_form
      - route
      - domain_availability
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        sfrx_id:
          type: string
        parent_sfrx_id:
          type:
          - string
          - 'null'
        product_tier:
          type: string
          enum:
          - pharma
          - semi
          - non_pharma
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        trade_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        primary_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        generic_name:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        generic_components:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
        strength:
          type:
          - string
          - 'null'
        dosage_form:
          $ref: '#/components/schemas/LocalizedString'
        route:
          $ref: '#/components/schemas/LocalizedString'
        manufacturer:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        package:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        barcode:
          type:
          - string
          - 'null'
        category_trail:
          type: array
          items:
            type: object
            required:
            - level
            - label
            properties:
              level:
                type: string
              label:
                $ref: '#/components/schemas/LocalizedString'
            additionalProperties: false
        facts:
          type: object
          additionalProperties: false
        clinical_uses:
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        pharmacology:
          type: object
          additionalProperties: false
        prose_details:
          type: object
          additionalProperties: false
        warnings:
          type: object
          additionalProperties: false
        domain_availability:
          type: object
          additionalProperties:
            type: string
            enum:
            - available
            - not_available
            - not_covered
            - unknown
      additionalProperties: false
    RegistryProductSummaryList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      - pagination
      - display_obligations
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        items:
          type: array
          items:
            type: object
            required:
            - sfrx_id
            - display_name
            - generic_name
            - strength
            - route
            - dosage_form
            properties:
              sfrx_id:
                type: string
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              generic_name:
                $ref: '#/components/schemas/LocalizedString'
              strength:
                type:
                - string
                - 'null'
              route:
                $ref: '#/components/schemas/LocalizedString'
              dosage_form:
                $ref: '#/components/schemas/LocalizedString'
            additionalProperties: false
        pagination:
          $ref: '#/components/schemas/Pagination'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    RegistrySuggestionList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      - display_obligations
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        items:
          type: array
          items:
            type: object
            required:
            - sfrx_id
            - display_name
            - match_reason
            - score
            properties:
              sfrx_id:
                type: string
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              match_reason:
                $ref: '#/components/schemas/LocalizedString'
              score:
                type: number
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    SafetyCapabilities:
      type: object
      required:
      - request_id
      - schema_version
      - educational_context
      - source_provenance
      - locale
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        display_name:
          $ref: '#/components/schemas/LocalizedString'
        summary:
          $ref: '#/components/schemas/LocalizedString'
        items:
          type: array
          items:
            type: object
            additionalProperties: false
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
      additionalProperties: false
    SafetyCheckResponse:
      type: object
      additionalProperties: false
      required:
      - request_id
      - result_id
      - schema_version
      - surface
      - locale
      - educational_context
      - source_provenance
      - review
      - summary
      - context_summary
      - signals
      - domain_coverage
      - unavailable_domains
      - limitations
      - display_obligations
      - correction_anchors
      properties:
        request_id:
          type: string
        result_id:
          type: string
        schema_version:
          type: string
        surface:
          type: string
          enum:
          - browser
          - enterprise_api
          - partner_api
        locale:
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        review:
          $ref: '#/components/schemas/ReviewState'
        summary:
          $ref: '#/components/schemas/LocalizedString'
        context_summary:
          description: Privacy-safe indication of whether request-supplied patient_context
            was applied to this check. Enterprise has no saved profile, so this never
            reports a saved-profile source; it never echoes raw patient_context values.
          type: object
          additionalProperties: false
          required:
          - status
          - missing_context_count
          - stale_context_count
          - contradiction_count
          properties:
            status:
              type: string
              enum:
              - request_context_applied
              - baseline_only
            missing_context_count:
              type: integer
              minimum: 0
            stale_context_count:
              type: integer
              minimum: 0
            contradiction_count:
              type: integer
              minimum: 0
        signals:
          type: array
          items:
            $ref: '#/components/schemas/SafetySignal'
        domain_coverage:
          type: array
          items:
            $ref: '#/components/schemas/SafetyBoardDomainState'
          default: []
        unavailable_domains:
          type: array
          items:
            $ref: '#/components/schemas/SafetyBoardDomainState'
          default: []
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          default: []
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        correction_anchors:
          type: array
          items:
            type: object
            additionalProperties: false
          default: []
    EnterpriseStatus:
      type: object
      additionalProperties: false
      required:
      - request_id
      - schema_version
      - status
      - capabilities
      - supported_locales
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        supported_locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
          minItems: 2
    EnterpriseCapabilities:
      type: object
      additionalProperties: false
      required:
      - request_id
      - schema_version
      - status
      - capabilities
      - supported_locales
      properties:
        request_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        status:
          type: string
        capabilities:
          type: array
          items:
            type: string
        supported_locales:
          type: array
          items:
            $ref: '#/components/schemas/Locale'
          minItems: 2
    AllergyResolution:
      type: object
      additionalProperties: false
      required: [request_id, schema_version, locale, items]
      properties:
        request_id: {type: string}
        schema_version: {type: string}
        locale: {$ref: '#/components/schemas/Locale'}
        items:
          type: array
          items: {type: object, additionalProperties: false}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        display_obligations: {$ref: '#/components/schemas/DisplayObligations'}
    AllergyFamilyList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: {type: array, items: {type: object, additionalProperties: false}}
        pagination: {$ref: '#/components/schemas/Pagination'}
        locale: {type: string}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
    AllergySubstanceList:
      type: object
      additionalProperties: false
      required: [items, pagination]
      properties:
        items: {type: array, items: {type: object, additionalProperties: false}}
        pagination: {$ref: '#/components/schemas/Pagination'}
        locale: {type: string}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
    PrescriptionUploadRequest:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {type: string, format: binary}
        pipeline_profile: {type: string, enum: [v5_fast, v7_smart, auto], default: auto}
        source: {type: string, default: web}
        device_id: {type: string}
        include_ddi: {type: boolean, default: true}
        include_allergy: {type: boolean, default: true}
        include_food: {type: boolean, default: false}
        include_meal: {type: boolean, default: false}
        include_dose: {type: boolean, default: false}
        include_clinical: {type: boolean, default: false}
        include_pllr: {type: boolean, default: false}
    PrescriptionCreated:
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, status, educational_context, source_provenance, review]
      properties:
        request_id: {type: string}
        prescription_id: {type: string}
        status: {type: string, enum: [accepted, processing]}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
    PrescriptionResult:
      type: object
      additionalProperties: false
      required: [request_id, prescription_id, workflow_id, status, created_at, updated_at, transitions, locale, educational_context, source_provenance, review, candidate_medications, display_obligations]
      properties:
        request_id: {type: string}
        prescription_id: {type: string}
        workflow_id: {type: string}
        status: {type: string}
        pipeline_profile: {type: [string, 'null']}
        reason_code: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        transitions: {type: array, items: {type: object, additionalProperties: false}}
        locale: {type: string}
        educational_context: {$ref: '#/components/schemas/EducationalContext'}
        source_provenance: {$ref: '#/components/schemas/SourceProvenance'}
        review: {$ref: '#/components/schemas/ReviewState'}
        candidate_medications: {type: array, items: {type: object, additionalProperties: false}}
        display_obligations: {$ref: '#/components/schemas/DisplayObligations'}
    Locale:
      type: string
      enum:
      - ar-EG
      - ar
      - en
      - mixed
    LocalizedString:
      type: object
      additionalProperties: false
      required:
      - en
      - ar
      properties:
        en:
          type: string
          minLength: 1
        ar:
          type: string
          minLength: 1
        transliteration:
          type:
          - string
          - 'null'
        direction:
          type:
          - string
          - 'null'
    Pagination:
      type: object
      additionalProperties: false
      required:
      - limit
      - has_more
      properties:
        limit:
          type: integer
        cursor:
          type:
          - string
          - 'null'
        next_cursor:
          type:
          - string
          - 'null'
        has_more:
          type: boolean
    SourceProvenance:
      description: Snapshot identifiers for the reference data used to produce this
        response. Does not describe internal model, resolver, or pipeline identity.
      type: object
      additionalProperties: false
      required:
      - registry_snapshot_id
      - safety_snapshot_id
      - policy_version
      - claim_catalog_version
      properties:
        registry_snapshot_id:
          type:
          - string
          - 'null'
        safety_snapshot_id:
          type:
          - string
          - 'null'
        policy_version:
          type: string
        claim_catalog_version:
          type:
          - string
          - 'null'
    DisplayObligations:
      type: object
      additionalProperties: false
      required:
      - must_show_educational_boundary
      - must_show_professional_review_language
      - must_show_source_snapshot
      - must_preserve_arabic_text
      - may_not_describe_as_medical_advice
      properties:
        must_show_educational_boundary:
          type: boolean
          const: true
        must_show_professional_review_language:
          type: boolean
        must_show_source_snapshot:
          type: boolean
          const: true
        must_preserve_arabic_text:
          type: boolean
          const: true
        must_preserve_rtl_layout:
          type: boolean
          default: true
        may_not_describe_as_medical_advice:
          type: boolean
          const: true
    EducationalContext:
      type: object
      additionalProperties: false
      required:
      - classification
      - not_medical_advice
      - not_dispensing_authorization
      - professional_review_required
      - basis
      - source_snapshot_id
      - generated_at
      - policy_version
      - claim_catalog_version
      - locale
      - supported_locales
      properties:
        classification:
          type: string
          const: pharmaceutical_education
        not_medical_advice:
          type: boolean
          const: true
        not_dispensing_authorization:
          type: boolean
          const: true
        professional_review_required:
          type: boolean
        basis:
          type: string
          enum:
          - curated_pharmaceutical_reference_data
        source_snapshot_id:
          type: string
          minLength: 1
        generated_at:
          type: string
          format: date-time
        policy_version:
          type: string
          minLength: 1
        claim_catalog_version:
          type: string
          minLength: 1
        locale:
          $ref: '#/components/schemas/Locale'
        supported_locales:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/Locale'
    ReviewState:
      type: object
      additionalProperties: false
      required:
      - required
      - status
      - minimum_reviewer_role
      - review_deadline_policy
      properties:
        required:
          type: boolean
        status:
          type: string
          enum:
          - not_required
          - pending
          - in_review
          - reviewed_acknowledged
          - reviewed_needs_followup
          - dismissed_as_not_applicable
          - escalated
          - expired
        reason_codes:
          type: array
          items:
            type: string
          default: []
        minimum_reviewer_role:
          type: string
          enum:
          - none
          - trained_operator
          - qualified_professional
          - pharmaceutical_reviewer
        review_deadline_policy:
          type: string
          enum:
          - before_relying_on_output
          - before_workflow_completion
          - optional
          - not_applicable
        review_outcome:
          type:
          - string
          - 'null'
          enum:
          - acknowledged_for_professional_review
          - needs_followup
          - not_applicable_to_case
          - data_quality_issue_reported
          - ocr_correction_applied
          - null
        review_note:
          $ref: '#/components/schemas/LocalizedString'
        reviewed_at:
          type:
          - string
          - 'null'
          format: date-time
    SafetyBoardDomainState:
      type: object
      additionalProperties: false
      required:
      - domain
      - status
      - code
      properties:
        domain:
          type: string
          enum:
          - ddi
          - pllr
          - food_interactions
          - meal_timing
          - allergy
          - clinical_dose
        status:
          type: string
          enum:
          - evaluated
          - not_applicable
          - unknown
          - unmapped
          - not_enough_context
          - unavailable
          - failed
        code:
          type: string
        display_label:
          $ref: '#/components/schemas/LocalizedString'
        status_label:
          $ref: '#/components/schemas/LocalizedString'
    SafetySignal:
      type: object
      additionalProperties: false
      required:
      - signal_id
      - domain
      - severity
      - action_bucket
      - title
      - reason
      - justification
      - evidence_refs
      - confidence
      - review_required
      - source_provenance
      properties:
        signal_id:
          type: string
        domain:
          type: string
          enum:
          - ddi
          - pllr
          - food_interactions
          - meal_timing
          - allergy
          - clinical_dose
        severity:
          type: string
          enum:
          - informational
          - low
          - moderate
          - high
          - critical
        action_bucket:
          type: string
          enum:
          - urgent_review
          - clarify_first
          - counsel
          - monitor
          - reference
        title:
          $ref: '#/components/schemas/LocalizedString'
        reason:
          $ref: '#/components/schemas/LocalizedString'
        justification:
          $ref: '#/components/schemas/LocalizedString'
        equivalent_options:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - display_name
            - equivalence_reason
            properties:
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              equivalence_reason:
                $ref: '#/components/schemas/LocalizedString'
          default: []
        evidence_refs:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
        confidence:
          type: number
          minimum: 0
          maximum: 1
        review_required:
          type: boolean
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
          default: []
    MedicationResolution:
      type: object
      additionalProperties: false
      required:
      - request_id
      - result_id
      - schema_version
      - surface
      - locale
      - educational_context
      - source_provenance
      - query
      - candidates
      - review
      - limitations
      properties:
        request_id:
          type: string
        result_id:
          type: string
        schema_version:
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        surface:
          type: string
          enum:
          - browser
          - enterprise_api
          - partner_api
        locale:
          $ref: '#/components/schemas/Locale'
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        query:
          type: object
          additionalProperties: false
          required:
          - raw_text
          properties:
            raw_text:
              type: string
            locale_hint:
              type:
              - string
              - 'null'
        candidates:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
            - sfrx_id
            - label
            - score
            properties:
              sfrx_id:
                type: string
              label:
                $ref: '#/components/schemas/LocalizedString'
              score:
                type: number
                minimum: 0
                maximum: 1
        selected_candidate_id:
          type:
          - string
          - 'null'
        review:
          $ref: '#/components/schemas/ReviewState'
        limitations:
          type: array
          items:
            $ref: '#/components/schemas/LocalizedString'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
