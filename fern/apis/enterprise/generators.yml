api:
  specs:
    - openapi: openapi/enterprise-v1.yaml

groups:
  python-sdk:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.57.2
        output:
          location: pypi
          package-name: saferx-pharma
          token: ${PYPI_TOKEN}
        config:
          client_class_name: SafeRxClient

  ts-sdk:
    generators:
      - name: fernapi/fern-typescript-sdk
        version: 3.48.2
        # Not a publishing path. saferx-pharma-sdk is published ONLY by
        # .github/workflows/sdk-publish.yml through npm trusted publishing (OIDC, no token);
        # see RELEASE_CHECKLIST.md "Publishing". This group only renders locally if run.
        output:
          location: local-file-system
          path: ../../../build/fern-ts-sdk
        config:
          namespaceExport: SafeRx
