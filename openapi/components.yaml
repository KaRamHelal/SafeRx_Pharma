openapi: 3.1.1
info:
  title: SafeRx Enterprise Public Components
  version: 2.0.2-preview.1
paths: {}
components:
  securitySchemes:
    enterpriseApiKey:
      type: apiKey
      in: header
      name: X-SafeRx-API-Key
      description: API key used as the HMAC signing secret. X-SafeRx-Timestamp, X-SafeRx-Nonce,
        and X-SafeRx-Signature are also required.
  parameters:
    cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    sfrxId:
      name: sfrx_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^SRX-[0-9]{3}-[0-9]{6}$
    signedNonce:
      name: X-SafeRx-Nonce
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 256
    signedSignature:
      name: X-SafeRx-Signature
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    signedTimestamp:
      name: X-SafeRx-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
  schemas:
    ClientSafetyCheckRequest:
      description: Enterprise safety-check input is request-scoped only. There is no
        server-held saved profile for this surface -- every patient factor considered
        for a check must be supplied explicitly on the request.
      type: object
      required:
      - medications
      - locale
      - requested_domains
      properties:
        locale:
          description: Locale to use for localized text in the response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        medications:
          description: Medications to evaluate. Give free-text input_text, a
            registry sfrx_id, or both; input_text may be omitted when sfrx_id is
            given. A bare name that matches one medicine in several strengths or
            forms is evaluated as its default systemic variant and the response
            review carries default_variant_selected; add dose_text, route or
            dosage_form, or pass sfrx_id, to pin the exact product.
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            anyOf:
            - required:
              - input_text
            - required:
              - sfrx_id
            properties:
              client_medication_id:
                description: Caller-supplied identifier echoed back for
                  correlating this entry with its evaluation (and with
                  resolved_medications in the response), not interpreted by
                  the API.
                type:
                - string
                - 'null'
              input_text:
                description: Free-text medication description, e.g. as written on
                  a prescription. Strength, form and route written inline
                  ("Warfarin 5 mg tablet") are parsed. Optional when sfrx_id is given.
                type:
                - string
                - 'null'
                minLength: 1
              sfrx_id:
                description: Registry identifier, when already known from a prior
                  resolve/search call. Authoritative when supplied; an unknown
                  id is reported as sfrx_id_unknown and is never replaced by a
                  text match.
                type:
                - string
                - 'null'
                pattern: ^SRX-[0-9]{3}-[0-9]{6}$
              dose_text:
                description: Strength as written ("5 mg", "1 g"). Used only to
                  select the registry product; the safety evaluation does not
                  read it.
                type:
                - string
                - 'null'
              route:
                description: Administration route ("oral", "IV"). Used only to
                  select the registry product.
                type:
                - string
                - 'null'
              dosage_form:
                description: Dosage form ("tablet", "syrup"). Used only to
                  select the registry product.
                type:
                - string
                - 'null'
              role:
                description: Which medication role this entry plays in the check.
                  target_medication is the medication under review; current_medication
                  marks a concurrently taken medication supplied for interaction
                  checking. Defaults to target_medication.
                type: string
                enum:
                - target_medication
                - current_medication
                default: target_medication
        patient_context:
          $ref: '#/components/schemas/PatientSafetyContext'
        requested_domains:
          description: Which of the six safety domains to evaluate. Domains not
            requested are simply not evaluated -- they will not appear in
            unavailable_domains either.
          type: array
          items:
            type: string
            enum:
            - pllr
            - ddi
            - clinical_dose
            - food_interactions
            - meal_timing
            - allergy
          uniqueItems: true
        idempotency_key:
          description: Client-supplied idempotency key. A retried request with
            the same key and body returns the original result rather than
            creating a new check. Required on this operation.
          type:
          - string
          - 'null'
      additionalProperties: false
    ErxSafetyCheckRequest:
      description: >-
        One electronic prescription to safety-check (2.0.5). lines are the medications being
        prescribed; current_medications are what the patient already takes and are checked
        against the lines. Each is identified like a safety-check medication: input_text,
        sfrx_id, or both, with dose_text, route and dosage_form selecting the registry
        product. frequency_text and duration_text are echoed in the response's erx object
        and are not evaluated. The response is an EnterpriseSafetyCheckResult with an erx echo.
      type: object
      additionalProperties: false
      required:
      - erx_payload
      - locale
      properties:
        locale:
          description: Locale to use for localized text in the response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        requested_domains:
          description: Domains to evaluate. All six when omitted.
          type: array
          uniqueItems: true
          minItems: 1
          items:
            type: string
            enum:
            - pllr
            - ddi
            - clinical_dose
            - food_interactions
            - meal_timing
            - allergy
        idempotency_key:
          description: Client-supplied idempotency key; must equal the Idempotency-Key
            header when both are sent. A retry with the same key and body returns the
            original result.
          type:
          - string
          - 'null'
        erx_payload:
          description: The prescription. lines and current_medications together hold at
            most 50 medications, and every line_ref and medication_ref is unique.
          type: object
          additionalProperties: false
          required:
          - prescription_ref
          - lines
          properties:
            prescription_ref:
              description: Your identifier for the prescription; echoed in the response.
              type: string
              minLength: 1
              maxLength: 128
            lines:
              description: The medications being prescribed (1-50).
              type: array
              minItems: 1
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - line_ref
                anyOf:
                - required: [input_text]
                - required: [sfrx_id]
                properties:
                  line_ref:
                    description: Your identifier for the line; echoed in the response.
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[A-Za-z0-9._:-]+$
                  input_text:
                    description: The medication as written. Optional when sfrx_id is given.
                    type: ['string', 'null']
                    minLength: 1
                  sfrx_id:
                    description: Registry identifier; authoritative when supplied.
                    type: ['string', 'null']
                    pattern: ^SRX-[0-9]{3}-[0-9]{6}$
                  dose_text:
                    description: Strength as written ("5 mg"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
                  route:
                    description: Administration route ("oral"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
                  dosage_form:
                    description: Dosage form ("tablet"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
                  frequency_text:
                    description: Frequency as written ("once daily"). Echoed only; not evaluated.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 120
                  duration_text:
                    description: Duration as written ("30 days"). Echoed only; not evaluated.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
            current_medications:
              description: Medications the patient already takes, checked against the lines.
              type: array
              maxItems: 49
              default: []
              items:
                type: object
                additionalProperties: false
                required:
                - medication_ref
                anyOf:
                - required: [input_text]
                - required: [sfrx_id]
                properties:
                  medication_ref:
                    description: Your identifier for the medication; echoed in resolved_medications.
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^[A-Za-z0-9._:-]+$
                  input_text:
                    description: The medication as written. Optional when sfrx_id is given.
                    type: ['string', 'null']
                    minLength: 1
                  sfrx_id:
                    description: Registry identifier; authoritative when supplied.
                    type: ['string', 'null']
                    pattern: ^SRX-[0-9]{3}-[0-9]{6}$
                  dose_text:
                    description: Strength as written ("5 mg"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
                  route:
                    description: Administration route ("oral"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
                  dosage_form:
                    description: Dosage form ("tablet"). Selects the registry product only.
                    type: ['string', 'null']
                    minLength: 1
                    maxLength: 80
            patient_context:
              $ref: '#/components/schemas/PatientSafetyContext'
    PatientSafetyContext:
      description: Optional patient factors considered for this single request only.
        Enterprise never reads or writes a saved profile; omitted fields are treated
        as unknown, not as "no risk factor present".
      type: object
      additionalProperties: false
      properties:
        age_years:
          description: Current age in years. Prefer date_of_birth when available;
            supply this only with age_reference_date if you have a snapshot age
            rather than a birth date.
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 150
        date_of_birth:
          description: Preferred age anchor. The current age is derived from this
            at evaluation time, so age-dependent guidance stays correct on later
            requests without resending an updated age_years.
          type:
          - string
          - 'null'
          format: date
        age_reference_date:
          description: Date on which the supplied age_years was true. Required
            alongside age_years when date_of_birth is not available, so age can
            still be advanced correctly over time.
          type:
          - string
          - 'null'
          format: date
        sex:
          description: Biological sex, used for domains where it affects
            evaluation (e.g. dosing). Use unknown rather than omitting the field
            when truly unknown.
          type:
          - string
          - 'null'
          enum:
          - female
          - male
          - intersex
          - unknown
          - null
        weight_kg:
          description: Body weight in kilograms, used for weight-sensitive dosing
            guidance where supported.
          type:
          - number
          - 'null'
          minimum: 0
        pregnancy_status:
          description: Current pregnancy status. not_applicable is distinct from
            unknown -- use it when pregnancy status genuinely does not apply
            (e.g. sex is male).
          type:
          - string
          - 'null'
          enum:
          - pregnant
          - not_pregnant
          - unknown
          - not_applicable
          - null
        lactation_status:
          description: Current lactation status. not_applicable is distinct from
            unknown -- use it when lactation status genuinely does not apply.
          type:
          - string
          - 'null'
          enum:
          - lactating
          - not_lactating
          - unknown
          - not_applicable
          - null
        pregnancy_context:
          description: Stage-aware pregnancy detail. Gestational age and trimester
            are derived server-side from these fields at evaluation time; do not
            compute trimester locally and send only the derived value.
          type: object
          additionalProperties: false
          properties:
            lmp_date:
              description: Last menstrual period date. Preferred source for
                deriving current gestational age when available.
              type:
              - string
              - 'null'
              format: date
            gestational_age_reference_date:
              description: Date on which the supplied gestational_age_weeks or
                gestational_age_months_approx was true. Required alongside those
                fields when lmp_date is not available, so gestational age can
                still be advanced correctly over time.
              type:
              - string
              - 'null'
              format: date
            gestational_age_weeks:
              description: Gestational age in weeks as of gestational_age_reference_date,
                when lmp_date is not available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 45
            gestational_age_months_approx:
              description: Approximate gestational age in months as of
                gestational_age_reference_date, when a more precise weeks value
                is not available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 11
        lactation_context:
          description: Infant-age detail used for lactation-specific guidance.
            Infant age is advanced server-side from these fields at evaluation
            time when an exact date of birth is not available.
          type: object
          additionalProperties: false
          properties:
            infant_age_reference_date:
              description: Date on which the supplied infant_age_days or
                infant_age_months_approx was true.
              type:
              - string
              - 'null'
              format: date
            infant_age_days:
              description: Infant age in days as of infant_age_reference_date.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 3650
            infant_age_months_approx:
              description: Approximate infant age in months as of
                infant_age_reference_date, when an exact day count is not
                available.
              type:
              - number
              - 'null'
              minimum: 0
              maximum: 120
        renal:
          description: Renal function context used for dose and interaction
            guidance in renally-cleared medications.
          type: object
          additionalProperties: false
          properties:
            crcl_ml_min:
              description: Creatinine clearance in mL/min, when known directly.
              type:
              - number
              - 'null'
              minimum: 0
            egfr_ml_min_1_73m2:
              description: Estimated glomerular filtration rate (mL/min/1.73m²),
                when known directly.
              type:
              - number
              - 'null'
              minimum: 0
            status:
              description: Categorical renal function status. Supply this when a
                numeric crcl_ml_min/egfr_ml_min_1_73m2 value is not available.
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - failure
              - dialysis
              - unknown
              - null
        hepatic:
          description: Hepatic function context used for dose and interaction
            guidance in hepatically-cleared medications.
          type: object
          additionalProperties: false
          properties:
            child_pugh:
              description: Child-Pugh class, when known directly.
              type:
              - string
              - 'null'
              enum:
              - A
              - B
              - C
              - unknown
              - null
            status:
              description: Categorical hepatic function status. Supply this when
                a Child-Pugh class is not available.
              type:
              - string
              - 'null'
              enum:
              - normal
              - mild
              - moderate
              - severe
              - unknown
              - null
        conditions:
          description: Normalized clinical-dose condition identifiers relevant to
            dosing and interaction guidance.
          type: array
          maxItems: 50
          items:
            type: string
            enum:
            - arrhythmia
            - asthma
            - bph
            - coronary
            - depression
            - diabetes
            - epilepsy
            - gi_bleeding
            - glaucoma
            - heart_failure
            - hypertension
            - hyperthyroidism
            - hypothyroidism
            - parkinsons
        allergy_state:
          type:
          - string
          - 'null'
          description: Explicitly distinguishes unknown allergies from confirmed no
            known allergies.
          enum:
          - unknown
          - confirmed_none
          - has_entries
          - null
        allergies:
          description: Individual allergy entries. Only meaningful alongside
            allergy_state == has_entries.
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
            - input_text
            properties:
              input_text:
                description: Free-text allergy description as reported.
                type: string
              entry_type:
                description: How input_text should be interpreted for matching --
                  a free-text description, a known allergy family, or a specific
                  product.
                type:
                - string
                - 'null'
                enum:
                - free_text
                - family
                - product
                - null
        diet_profile:
          description: Diet, supplement, and fasting context used for
            food-interaction and meal-timing guidance.
          type: object
          additionalProperties: false
          properties:
            diet_patterns:
              description: Active diet patterns. Currently source-backed patterns
                are vegan, keto_low_carb, high_protein_fitness, mediterranean,
                intermittent_fasting, and ramadan_fasting; other values are
                accepted as non-signaling context.
              type: array
              uniqueItems: true
              maxItems: 20
              items:
                type: string
                enum:
                - vegetarian
                - vegan
                - pescatarian
                - keto_low_carb
                - high_protein_fitness
                - mediterranean
                - dash_low_sodium
                - diabetes_carb_managed
                - renal_modified
                - gluten_free
                - lactose_or_cow_milk_free
                - low_fodmap
                - low_purine
                - halal
                - kosher
                - ramadan_fasting
                - intermittent_fasting
                - other
            fasting_pattern:
              description: Active fasting pattern, relevant to meal-timing
                guidance for medications with food/timing constraints.
              type:
              - string
              - 'null'
              enum:
              - none
              - ramadan
              - intermittent_fasting
              - time_restricted_eating
              - unknown
              - null
            food_exposures:
              description: Confirmed or reported dietary/food exposures relevant
                to food-interaction guidance (e.g. grapefruit, tyramine-rich
                foods).
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    description: Which food exposure this entry reports.
                    type: string
                    enum:
                    - alcohol
                    - grapefruit_citrus
                    - dairy_calcium
                    - vitamin_k_leafy_greens
                    - caffeine
                    - tyramine_aged_fermented
                    - potassium_foods_or_salt_substitute
                    - high_fiber
                    - high_fat_meal
                    - licorice
                    - green_tea
                    - hibiscus
                    - black_seed
                    - fenugreek
                    - fava_beans
                    - other
                  confirmation_state:
                    description: How confidently this exposure applies to the
                      patient right now.
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
            supplement_exposures:
              description: Confirmed or reported supplement use relevant to
                interaction guidance.
              type: array
              maxItems: 50
              items:
                type: object
                additionalProperties: false
                required:
                - exposure_id
                - confirmation_state
                properties:
                  exposure_id:
                    description: Which supplement this entry reports.
                    type: string
                    enum:
                    - protein_powder_whey_casein
                    - calcium
                    - iron
                    - magnesium
                    - potassium_or_electrolyte
                    - caffeine_preworkout
                    - creatine
                    - herbal_supplement
                    - other
                  confirmation_state:
                    description: How confidently this supplement use applies to
                      the patient right now.
                    type: string
                    enum:
                    - confirmed_current
                    - frequent
                    - occasional
                    - avoids
                    - unknown
    IngredientList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - display_obligations
      - items
      - pagination
      properties:
        request_id:
          description: Echo of the request identifier for correlation.
          type: string
        schema_version:
          description: Semantic version of this response's schema shape.
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          description: Locale used for localized text in this response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          description: Matching ingredients.
          type: array
          items:
            type: object
            required:
            - ingredient_id
            - ingredient_type
            - display_name
            - linked_product_count
            - linked_sfrx_ids
            properties:
              ingredient_id:
                description: Stable identifier for this ingredient.
                type: string
              ingredient_type:
                description: What kind of ingredient concept this is.
                type: string
                enum:
                - active
                - generic_component
                - therapeutic_class
              display_name:
                $ref: '#/components/schemas/LocalizedString'
              linked_product_count:
                description: Number of registry products containing this
                  ingredient.
                type: integer
                minimum: 0
              linked_sfrx_ids:
                description: Registry identifiers of products containing this
                  ingredient.
                type: array
                items:
                  type: string
              correction_anchors:
                description: Opaque anchors for reporting a correction against
                  this entry.
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionAnchor'
            additionalProperties: false
        pagination:
          $ref: '#/components/schemas/Pagination'
      additionalProperties: false
    MedicationResolutionList:
      type: object
      required:
      - request_id
      - schema_version
      - locale
      - educational_context
      - source_provenance
      - items
      properties:
        request_id:
          description: Echo of the request identifier for correlation.
          type: string
        schema_version:
          description: Semantic version of this response's schema shape.
          type: string
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
        locale:
          description: Locale used for localized text in this response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        items:
          description: One resolution result per requested medication, in
            request order.
          type: array
          items:
            $ref: '#/components/schemas/MedicationResolution'
      additionalProperties: false
    MedicationResolutionRequest:
      description: Request body for medication resolution. This schema previously
        required response-shaped fields (educational_context, source_provenance,
        review, summary) that no client could construct -- a documentation defect,
        since resolver-service's real request contract only accepts a locale and
        one or more free-text medications. Corrected to match the same
        medications[]/locale shape already used by the hosted MCP's
        resolve_medications tool, which is validated against the same backend.
      type: object
      required:
      - locale
      - medications
      properties:
        locale:
          description: Locale to use for localized text in the response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        medications:
          description: Medications to resolve. Give input_text, sfrx_id, or both.
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            anyOf:
            - required:
              - input_text
            - required:
              - sfrx_id
            properties:
              client_medication_id:
                description: Caller-supplied identifier echoed back for
                  correlating this entry with its resolution, not interpreted by
                  the API.
                type:
                - string
                - 'null'
              input_text:
                description: Free-text medication description to resolve.
                  Strength, form and route written inline are parsed. Optional
                  when sfrx_id is given.
                type:
                - string
                - 'null'
                minLength: 1
              sfrx_id:
                description: Registry identifier, when already known. Authoritative
                  when supplied; the product is fetched directly and an unknown id
                  is reported as sfrx_id_unknown rather than matched by text.
                type:
                - string
                - 'null'
                pattern: ^SRX-[0-9]{3}-[0-9]{6}$
              dose_text:
                description: Strength as written ("5 mg", "1 g"), used to pick the
                  candidate strength (1 g and 1000 mg are equivalent).
                type:
                - string
                - 'null'
              route:
                description: Administration route ("oral", "IV"), used to pick the
                  candidate route.
                type:
                - string
                - 'null'
              dosage_form:
                description: Dosage form ("tablet", "syrup"), used to pick the
                  candidate form.
                type:
                - string
                - 'null'
      additionalProperties: false
    ProblemDetails:
      description: RFC 9457 problem response returned for every non-success status.
        Always check code for programmatic handling; detail is for humans and may
        change wording without notice.
      type: object
      required:
      - type
      - title
      - status
      - request_id
      - code
      properties:
        type:
          description: A URI identifying the problem type. Stable for a given code.
          type: string
          format: uri-reference
        title:
          description: Short, human-readable summary of the problem type.
          type: string
        status:
          description: HTTP status code, repeated here for convenience.
          type: integer
          minimum: 400
          maximum: 599
        detail:
          description: Human-readable detail specific to this occurrence. Not
            stable -- do not pattern-match on this text; use code instead.
          type: string
        instance:
          description: URI identifying this specific occurrence, when available.
          type: string
        operation_id:
          description: Which operation this error occurred on, when available.
            Matches the operationId values used throughout this documentation.
          type: string
        path:
          description: Request path this error occurred on, when available.
          type: string
        request_id:
          description: Request identifier for this occurrence. Include it when
            contacting support about a specific failure.
          type: string
        code:
          description: |-
            Stable machine-readable error code. Safe to switch on. Signed-request
            failures use these codes:

            - `API_KEY_REQUIRED` (401): no `X-SafeRx-API-Key` header.
            - `API_KEY_SIGNATURE_REQUIRED` (401): timestamp, nonce, or signature header missing.
            - `API_KEY_INVALID` (401): the key is not recognized.
            - `API_KEY_SIGNATURE_INVALID` (401): the signature does not match the canonical request.
            - `API_KEY_TIMESTAMP_INVALID` (401): timestamp unparseable, offset-less, or outside the clock-skew window.
            - `API_KEY_NONCE_REJECTED` (401): nonce reused or malformed -- sign every attempt, including retries, with a fresh nonce.
            - `API_KEY_NOT_ENTITLED` (403): the key's plan does not include this operation.
            - `API_KEY_EXPIRED` (403): the key has passed its expiry.
            - `API_KEY_DENIED` (403): the key or its organization is suspended, revoked, or otherwise not authorized.
          type: string
        retry_after_seconds:
          description: Seconds to wait before retrying, when applicable (e.g.
            429, some 503s). Prefer this or the Retry-After header over a fixed
            client-side backoff.
          type:
          - integer
          - 'null'
        retry_after:
          description: Compatibility projection of Retry-After in seconds for existing
            web clients.
          type:
          - integer
          - 'null'
          minimum: 0
        quota_metric:
          description: Which quota class this error relates to, when the error is
            quota-related.
          type:
          - string
          - 'null'
        rate_limit:
          description: Current rate-limit window state, present on rate-limit
            errors.
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            limit:
              description: Requests allowed in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              description: Requests remaining in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            reset:
              description: Seconds until the window resets.
              type:
              - integer
              - 'null'
              minimum: 0
        quota:
          description: Current quota state, present on quota-related errors.
          type:
          - object
          - 'null'
          additionalProperties: false
          properties:
            metric:
              description: Which quota class this quota state describes.
              type:
              - string
              - 'null'
            limit:
              description: Total allowance for the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            remaining:
              description: Allowance remaining in the current window.
              type:
              - integer
              - 'null'
              minimum: 0
            reset_at:
              description: When the current window resets.
              type:
              - string
              - 'null'
              format: date-time
            window_seconds:
              description: Length of the quota window in seconds.
              type:
              - integer
              - 'null'
              minimum: 0
            window:
              description: Present as "hour" when the self-serve short-term ceiling was
                exceeded (window_seconds 3600); absent for the daily quota.
              type:
              - string
              - 'null'
              enum:
              - hour
              - null
        safe_to_retry:
          description: Whether this exact request is safe to retry as-is (e.g.
            after a transient 503) without risk of duplicating a side-effecting
            operation.
          type: boolean
      additionalProperties: false
    RegistryProductDetail:
      description: Corrected against the real backend response contract --
        the previous version of this schema used invented field names
        (display_name/generic_name/generic_components) that don't match the
        real response (tradename/generic), and typed pharmacology/prose_details/
        warnings as always-empty objects, which would have rejected every real
        response. price and in_stock are intentionally omitted, since this is
        a curated educational reference, not a commerce/inventory API.
