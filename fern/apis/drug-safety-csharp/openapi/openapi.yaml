paths:
  /api/drug_safety/check:
    post:
      operationId: checkDrugSafety
      x-fern-sdk-group-name: drugSafety
      x-fern-sdk-method-name: check
      summary: Check drug safety
      description: |
        Screen one or more drugs across seven safety domains in a single request.

        The API resolves drug names via fuzzy matching, runs all requested safety
        checks in parallel, and returns a unified response with alerts bubbled to
        the top for easy triage.

        This endpoint is API-key only. It does not require `X-SafeRx-Token`.

        **Typical response time:** ~40ms (warm cache, 3 drugs, all domains).
      tags:
        - Drug Safety
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DrugSafetyCheckRequest'
            examples:
              basic:
                summary: Basic 3-drug check
                value:
                  drugs:
                    - "Augmentin 1g"
                    - "Glucophage 500mg"
                    - "Marivan"
                  lang: "en"
              with_patient_profile:
                summary: Personalized check with patient profile
                value:
                  drugs:
                    - "Augmentin 1g"
                    - "Glucophage 500mg"
                    - "Marivan"
                  patient_profile:
                    populations:
                      - "geriatric"
                      - "renal"
                    conditions:
                      - "diabetes"
                      - "hypertension"
                    allergies:
                      - "penicillin"
                  include:
                    - "ae"
                    - "ddi"
                    - "pllr"
                    - "food"
                    - "clinical"
                    - "dose"
                    - "allergy"
                  lang: "en"
              with_intelligence_context:
                summary: Medication intelligence check with longitudinal context
                value:
                  drugs:
                    - "Augmentin 1g"
                    - "Marivan"
                  intelligence_context:
                    user_id: "patient-123"
                    clinical_profile:
                      age: 72
                      crcl: 38
                      hepatic_status: "normal"
                      pregnancy: false
                      lactation: false
                      conditions:
                        - "renal impairment"
                        - "hypertension"
                      populations:
                        - "geriatric"
                        - "renal"
                      allergies:
                        - "penicillin"
                      diet_habits:
                        - "low_sodium"
                    medication_history:
