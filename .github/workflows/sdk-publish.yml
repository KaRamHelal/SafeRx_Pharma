name: Publish SDKs

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "fern/**"
      - "mcp-server/**"
      - ".github/workflows/sdk-publish.yml"
  workflow_dispatch:

concurrency:
  group: publish-sdks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-sdks:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mcp:
              - 'mcp-server/**'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Resolve SDK package versions
        id: sdk_versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import urllib.request

          def bump_patch(version: str) -> str:
              parts = version.strip().split(".")
              if len(parts) != 3 or not all(part.isdigit() for part in parts):
                  raise SystemExit(f"Cannot bump non-semver package version: {version}")
              parts[2] = str(int(parts[2]) + 1)
              return ".".join(parts)

          def latest_semver(versions):
              parsed = []
              for version in versions:
                  parts = version.strip().split(".")
                  if len(parts) == 3 and all(part.isdigit() for part in parts):
                      parsed.append((tuple(int(part) for part in parts), version))
              if not parsed:
                  raise SystemExit("No numeric semver package versions found")
              return sorted(parsed)[-1][1]

          pypi = json.load(urllib.request.urlopen("https://pypi.org/pypi/saferx-pharma/json", timeout=20))
          python_version = bump_patch(pypi["info"]["version"])

          npm = json.load(urllib.request.urlopen("https://registry.npmjs.org/saferx-pharma-sdk", timeout=20))
          ts_version = bump_patch(latest_semver(npm["versions"]))

          nuget = json.load(urllib.request.urlopen("https://api.nuget.org/v3-flatcontainer/saferx/index.json", timeout=20))
          csharp_version = bump_patch(latest_semver(nuget["versions"]))

          print(f"python={python_version}")
          print(f"typescript={ts_version}")
          print(f"csharp={csharp_version}")
          PY

      - name: Generate & Publish Python SDK
        run: fern generate --group python-sdk --api drug-safety --version "${{ steps.sdk_versions.outputs.python }}"
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate & Publish TypeScript SDK
        run: fern generate --group ts-sdk --api drug-safety --version "${{ steps.sdk_versions.outputs.typescript }}"
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate C# SDK
        run: fern generate --group csharp-sdk --api drug-safety-csharp --force
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Fix & Publish C# SDK
        shell: bash
        run: |
          set -euo pipefail
          python scripts/fix_csharp_sdk_bug.py --pharma-root .
          SDK_VERSION="${{ steps.sdk_versions.outputs.csharp }}"
          export SDK_VERSION
          echo "Packing C# SDK as SafeRx ${SDK_VERSION}"
          dotnet pack fern/generated/csharp-sdk/src/SaferxApi/SaferxApi.csproj -c Release -p:Version="$SDK_VERSION"
          dotnet nuget push "fern/generated/csharp-sdk/src/SaferxApi/bin/Release/SafeRx.${SDK_VERSION}.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          echo "Checking NuGet registry visibility for SafeRx ${SDK_VERSION}"
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          expected = os.environ["SDK_VERSION"]
          url = "https://api.nuget.org/v3-flatcontainer/saferx/index.json"
          for attempt in range(1, 31):
              data = json.load(urllib.request.urlopen(url, timeout=20))
              versions = data.get("versions", [])
              if expected.lower() in [v.lower() for v in versions]:
                  print(f"SafeRx {expected} is visible on NuGet")
                  break
              print(f"SafeRx {expected} not indexed yet (attempt {attempt}/30); waiting...")
              time.sleep(20)
          else:
              print(f"::warning::SafeRx {expected} was pushed successfully but is not visible in the NuGet flat-container index yet. Continuing so MCP/docs publish is not skipped by NuGet indexing lag.")
          PY
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Build & Publish MCP Server
        if: steps.changes.outputs.mcp == 'true'
        shell: bash
        run: |
          cd mcp-server
          npm install
          npm run build
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view @saferx_pharma/mcp-server version 2>/dev/null || echo "none")
          echo "Local MCP version: $LOCAL_VERSION"
          echo "Remote MCP version: $REMOTE_VERSION"
          if [ "$LOCAL_VERSION" = "$REMOTE_VERSION" ]; then
            echo "ERROR: MCP package version was not bumped (still $LOCAL_VERSION)."
            echo "Please bump mcp-server/package.json version before publishing."
            exit 1
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Fern Docs
        timeout-minutes: 10
        run: fern generate --docs --force --no-prompt
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
