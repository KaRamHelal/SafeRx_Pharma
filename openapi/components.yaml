        locale:
          description: Locale used for localized text in this response.
          type: string
          enum:
          - ar-EG
          - ar
          - en
          - mixed
        educational_context:
          $ref: '#/components/schemas/EducationalContext'
        source_provenance:
          $ref: '#/components/schemas/SourceProvenance'
        display_obligations:
          $ref: '#/components/schemas/DisplayObligations'
        sfrx_id:
          description: Stable SafeRx registry identifier for this product.
          type: string
        parent_sfrx_id:
          description: sfrx_id of a parent product, when this product is a
            variant or pack of another registry entry.
          type:
          - string
          - 'null'
        product_tier:
          description: Regulatory/commercial tier this product belongs to.
          type: string
          enum:
          - pharma
          - semi
          - non_pharma
        tradename:
          $ref: '#/components/schemas/LocalizedString'
        primary_name:
          description: Primary reference name, when distinct from tradename.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        generic:
          description: Generic/INN name, when known.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        strength:
          description: Strength as printed on the product (e.g. "500mg"), not
            structured.
          type:
          - string
          - 'null'
        dosage_form:
          $ref: '#/components/schemas/LocalizedString'
        route:
          $ref: '#/components/schemas/LocalizedString'
        manufacturer:
          description: Manufacturer name, when known.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        supplier:
          description: Supplier name, when known and distinct from manufacturer.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        package:
          description: Package/pack size description, when known.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        barcode:
          description: Product barcode, when known.
          type:
          - string
          - 'null'
        category_trail:
          description: Registry category hierarchy this product belongs to, from
            broadest to most specific.
          type: array
          items:
            type: object
            required:
            - level
            - label
            properties:
              level:
                description: Position in the category hierarchy.
                type: string
              label:
                $ref: '#/components/schemas/LocalizedString'
            additionalProperties: false
        clinical_uses:
          description: Educational summary of clinical uses, when available.
          oneOf:
          - $ref: '#/components/schemas/LocalizedString'
          - type: 'null'
        pharmacology:
          description: Structured pharmacology reference detail, when available.
          type: object
          additionalProperties: false
          properties:
