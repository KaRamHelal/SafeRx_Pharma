# Root generators.yml — INTENTIONALLY EMPTY for SDK groups.
#
# SDK generation is defined in sub-API configs ONLY:
#   fern/apis/drug-safety/generators.yml      — Python + TypeScript
#   fern/apis/drug-safety-csharp/generators.yml — C#
#
# This prevents dual version counters (root vs sub-API).
# CI uses: fern generate --group <group> --api <api>
#
# Inactive SDK configs (Java/Go/Swift) preserved below for future use.

groups:
  java-sdk:
    generators:
      - name: fernapi/fern-java-sdk
        version: 0.x
        output:
          location: maven
          coordinate: online.saferx:saferx-java
          username: ${MAVEN_USERNAME}
          password: ${MAVEN_PASSWORD}

  go-sdk:
    generators:
      - name: fernapi/fern-go-sdk
        version: 0.x
        github:
          repository: KaRamHelal/saferx-go

  swift-sdk:
    generators:
      - name: fernapi/fern-swift-sdk
        version: 0.x
        github:
          repository: KaRamHelal/saferx-swift
