name: Public Release Preflight

on:
  pull_request:
    paths:
      - "openapi/**"
      - "fern/**"
      - "packages/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "scripts/release_preflight.py"
      - "scripts/generate_enterprise_sdks.py"
      - "scripts/render_fern_changelog.py"
      - "scripts/build_example_fixtures.py"
      - "scripts/validate_examples.py"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "fern/**"
      - "packages/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "scripts/release_preflight.py"
      - "scripts/generate_enterprise_sdks.py"
      - "scripts/render_fern_changelog.py"
      - "scripts/build_example_fixtures.py"
      - "scripts/validate_examples.py"
      - "tests/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # release_preflight.py compares against past git tags (vX.Y.Z)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "jsonschema==4.23.0" "pytest==8.3.3"
      - name: Validate public release inputs
        run: python scripts/release_preflight.py
      - name: Validate rendered changelog is current
        run: python scripts/render_fern_changelog.py --check
      - name: Validate example fixtures are current
        run: python scripts/build_example_fixtures.py --check
      - name: Validate example fixtures against the real schemas
        run: python scripts/validate_examples.py
      - name: Run the regression test suite
        run: python -m pytest tests/ -v
