release_id: enterprise-v1-2026.08.15
release_version: 2.0.2
status: available
publishable: true

api_contract:
  source: openapi/enterprise-v1.yaml
  openapi_version: 3.1.1
  operation_count: 14
  deferred_operation_count: 7
  authentication: saferx-hmac-sha256-v1
  response_policy: closed_schema

artifacts:
  python: saferx-pharma==2.0.2
  typescript: saferx-pharma-sdk@2.0.2
  csharp: SafeRx==2.0.2

hosted_mcp:
  status: preview
  endpoint: https://saferx.online/api/enterprise-mcp/v1/mcp
  protocol_version: '2025-06-18'
  transport: streamable_http
  tools: [resolve_medications, check_medication_safety, get_safety_capabilities]
  resources: []
  prompts: []
  promoted_at: '2026-08-15'

documentation:
  fern_instance: saferx.docs.buildwithfern.com
  custom_domain: docs.saferx.online

availability:
  plan: enterprise_free
  key_required: true

notes:
  - operation_count reflects only operations with a complete, live-verified success
    contract; deferred_operation_count lists operations still returning 501 upstream
    and therefore excluded from the public bundle, SDK clients, and docs until they
    have a real success schema and evidence (see openapi/enterprise-v1.yaml x-status).
  - Hosted MCP was promoted from internal_only to preview on 2026-08-15 in
    SafeRx-MIS's public-availability-state-machine.yaml and documentation-bindings.yaml.
    It exposes exactly the three tools listed above with no resources or prompts.
  - The legacy stdio @saferx_pharma/mcp-server package remains internal_only and
    deprecated; it is not the supported MCP integration path.
  - This manifest is the public release identity only. It does not describe any
    account, plan, or entitlement other than the existing self-service free plan.
  - Live-verified 2026-08-15 with a real signed key against production --
    enterprise_registry_search, enterprise_registry_resolve, and
    enterprise_registry_autocomplete all returned real, schema-valid
    responses matching the corrected tradename/generic field names. A denied
    call to enterprise_safety_capabilities also confirmed the signing
    implementation reaches and is understood by the real gateway (403
    API_KEY_DENIED, not an auth/signature failure). Full blackbox coverage
    of all 14 available operations is still pending (plan section 12).
