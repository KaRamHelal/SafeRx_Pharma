                        start_date: "2026-01-10"
                        status: "active"
                      - sfrx_id: "SRX-050-000123"
                        start_date: "2025-09-01"
                        status: "historical"
                  include:
                    - "ae"
                    - "ddi"
                    - "pllr"
                    - "food"
                    - "clinical"
                    - "dose"
                    - "allergy"
                  lang: "en"
              selective_domains:
                summary: DDI-only check (fastest)
                value:
                  drugs:
                    - "Augmentin 1g"
                    - "Marivan"
                  include:
                    - "ddi"
              arabic:
                summary: Arabic language response
                value:
                  drugs:
                    - "Augmentin 1g"
                    - "Glucophage 500mg"
                  lang: "ar"
