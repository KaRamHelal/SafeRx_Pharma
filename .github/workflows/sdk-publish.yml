name: Publish Enterprise SDKs

# mcp-server is NOT published here: SafeRx-MIS's public-availability-state-machine.yaml
# marks mcp-stdio as internal_only/public_eligible:false. It was previously published to
# npm in error (see public-package-catalog.yaml history); that live package is being
# replaced by the hosted MCP surface and is not re-published from this workflow.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Immutable release version"
        required: true
        default: "2.0.2"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate release contract
        run: |
          python -m pip install --disable-pip-version-check "PyYAML==6.0.2" "jsonschema==4.23.0" "pytest==8.3.3"
          python scripts/release_preflight.py
          python scripts/generate_enterprise_sdks.py --check
          python scripts/render_fern_changelog.py --check
          python scripts/build_example_fixtures.py --check
          python scripts/validate_examples.py
          python -m pytest tests/ -v

      - name: Determine release version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${DISPATCH_VERSION}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "could not determine the release version being published" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}

      - name: Require an approved available release
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          manifest = yaml.safe_load(Path("release/current.yaml").read_text())
          if manifest.get("status") != "available" or manifest.get("publishable") is not True:
              raise SystemExit("publication is blocked: the checked-in MIS release is not available")
          PY

      - name: Require a matching CHANGELOG.md entry
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          if not re.search(rf"^## \[{re.escape(version)}\]", changelog, re.MULTILINE):
              raise SystemExit(f"CHANGELOG.md has no '## [{version}]' entry — add one before publishing")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and publish Python client
        working-directory: packages/python
        run: |
          python -m pip install build twine
          python -m build
          python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org

      - name: Build and publish TypeScript client
        working-directory: packages/typescript
        run: |
          npm install
          npm run build
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Pack and publish C# client
        working-directory: packages/csharp
        run: |
          dotnet pack -c Release -o nupkg
          dotnet nuget push nupkg/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Create GitHub Release
        run: |
          python - <<'PY' > /tmp/release_notes.md
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text()
          match = re.search(rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", changelog, re.MULTILINE | re.DOTALL)
          print(match.group(0).strip() if match else f"See CHANGELOG.md for the [{version}] entry.")
          PY
          gh release create "v${VERSION}" --title "SafeRx Enterprise SDKs v${VERSION}" --notes-file /tmp/release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
