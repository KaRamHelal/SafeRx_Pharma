name: Public Release Preflight

on:
  pull_request:
    paths:
      - "openapi/**"
      - "fern/**"
      - "packages/**"
      - "CHANGELOG.md"
      - "scripts/release_preflight.py"
      - "scripts/generate_enterprise_sdks.py"
      - "scripts/render_fern_changelog.py"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "fern/**"
      - "packages/**"
      - "CHANGELOG.md"
      - "scripts/release_preflight.py"
      - "scripts/generate_enterprise_sdks.py"
      - "scripts/render_fern_changelog.py"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.2"
      - name: Validate public release inputs
        run: python scripts/release_preflight.py
      - name: Validate rendered changelog is current
        run: python scripts/render_fern_changelog.py --check
