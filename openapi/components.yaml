                review before relying on them.
              type: boolean
            warnings_en:
              description: English warnings text as carried by the registry
                source, when available. Not yet localized.
              type:
              - string
              - 'null'
        domain_availability:
          description: Per-safety-domain availability for this product, keyed by
            domain id.
          type: object
          additionalProperties:
            type: string
            enum:
