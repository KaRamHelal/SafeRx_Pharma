name: Publish SDKs

on:
  push:
    branches: [main]
    paths:
      - "openapi/**"
      - "fern/**"
      - "mcp-server/**"
      - ".github/workflows/sdk-publish.yml"
  workflow_dispatch:

jobs:
  publish-sdks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect changed areas
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mcp:
              - 'mcp-server/**'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Fern CLI
        run: npm install -g fern-api

      - name: Generate & Publish Python SDK
        run: fern generate --group python-sdk --api drug-safety
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}

      - name: Generate & Publish TypeScript SDK
        run: fern generate --group ts-sdk --api drug-safety
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Generate C# SDK
        run: fern generate --group csharp-sdk --api drug-safety-csharp --force
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}

      - name: Fix & Publish C# SDK
        run: |
          python scripts/fix_csharp_sdk_bug.py --pharma-root .
          dotnet pack fern/generated/csharp-sdk/src/SaferxApi/SaferxApi.csproj -c Release
          dotnet nuget push fern/generated/csharp-sdk/src/SaferxApi/bin/Release/SafeRx.*.nupkg --api-key $NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

      - name: Build & Publish MCP Server
        if: steps.changes.outputs.mcp == 'true'
        shell: bash
        run: |
          cd mcp-server
          npm ci
          npm run build
          LOCAL_VERSION=$(node -p "require('./package.json').version")
          REMOTE_VERSION=$(npm view @saferx_pharma/mcp-server version 2>/dev/null || echo "none")
          echo "Local MCP version: $LOCAL_VERSION"
          echo "Remote MCP version: $REMOTE_VERSION"
          if [ "$LOCAL_VERSION" = "$REMOTE_VERSION" ]; then
            echo "ERROR: MCP package version was not bumped (still $LOCAL_VERSION)."
            echo "Please bump mcp-server/package.json version before publishing."
            exit 1
          fi
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish Fern Docs
        run: echo "y" | fern generate --docs
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
